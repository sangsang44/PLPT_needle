<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>설비효율관리 OEE 대시보드</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; margin: 0; }
    .header { background-color: #2c3e50; color: white; padding: 10px 20px; display: flex; gap: 15px; }
    .header div { padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
    .header .active { background-color: #34495e; border-bottom: 3px solid #3498db; }
    .container { padding: 20px; max-width: 1200px; margin: auto; }
    .cards { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 200px; border-top: 4px solid #3498db; }
    .card h3 { margin: 0 0 10px 0; color: #555; font-size: 16px; }
    .card h1 { margin: 0; font-size: 32px; color: #222; }
    .charts { display: flex; gap: 20px; flex-wrap: wrap; }
    .chart-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 400px; }
  </style>
  <!-- 그래프를 그려주는 외부 라이브러리 (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="header">
    <div>🏭 설비효율관리</div>
    <div class="active">📊 종합현황</div>
    <div>🔧 사출</div>
    <div>💉 주사침</div>
    <div>⚙️ 연마</div>
  </div>
  
  <div class="container">
    <h2 style="color: #333;">종합현황 <span style="font-size:14px; color:#888;">(최근 업데이트: 2026-11-10)</span></h2>
    
    <!-- 상단 요약 카드 -->
    <div class="cards">
      <div class="card" style="border-top-color: #9b59b6;">
        <h3>사출 OEE</h3><h1>85.2%</h1>
      </div>
      <div class="card" style="border-top-color: #2ecc71;">
        <h3>주사침 OEE</h3><h1>92.0%</h1>
      </div>
      <div class="card" style="border-top-color: #e67e22;">
        <h3>멸균 OEE</h3><h1>78.5%</h1>
      </div>
    </div>

    <!-- 하단 그래프 영역 -->
    <div class="charts">
      <div class="chart-box">
        <canvas id="oeeChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // 막대 그래프 그리기 세팅
    const ctx = document.getElementById('oeeChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['사출', '코팩', '주사침', '연마', '멸균'],
        datasets: [{
          label: '공정별 OEE (%)',
          data: [85.2, 0, 92.0, 0, 78.5],
          backgroundColor: '#3498db'
        }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
    });
  </script>
</body>
</html>
