<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사침 생산현황 검색</title>
    <!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .upload-section {
            margin-bottom: 20px;
            padding: 20px;
            background-color: #eef2f5;
            border-radius: 8px;
            text-align: center;
        }
        input[type="file"] {
            font-size: 16px;
        }
        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .search-section input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            flex: 1;
            min-width: 150px;
        }
        .search-section button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .search-section button:hover {
            background-color: #2980b9;
        }
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .empty-message {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>주사침 생산현황 검색</h1>
    
    <div class="upload-section">
        <label for="excelFile"><strong>생산현황 엑셀 파일 업로드 (.xlsx) : </strong></label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <div class="search-section">
        <input type="text" id="searchProduct" placeholder="제품명 검색">
        <input type="text" id="searchLot" placeholder="로트 검색">
        <input type="text" id="searchProcess" placeholder="공정 검색">
        <input type="text" id="searchQuantity" placeholder="생산수량 검색">
        <button onclick="filterData()">검색하기</button>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <!-- 헤더가 여기에 생성됩니다 -->
            </thead>
            <tbody>
                <tr>
                    <td colspan="100%" class="empty-message">엑셀 파일을 업로드하면 데이터가 표시됩니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let globalData = []; // 엑셀 원본 데이터를 저장할 변수
    let headers = [];    // 엑셀 열 이름(헤더)을 저장할 변수

    // 엑셀 파일이 업로드 되면 실행되는 함수
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            
            // 첫 번째 시트의 이름 가져오기
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            // 엑셀을 JSON 배열로 변환
            // defval: "" <- 이 옵션이 빈 셀을 건너뛰지 않고 빈칸으로 확실히 읽어들이게 합니다.
            globalData = XLSX.utils.sheet_to_json(worksheet, {defval: ""});
            
            if(globalData.length > 0) {
                headers = Object.keys(globalData[0]); // 첫 번째 행의 키값을 헤더로 사용
                renderTable(globalData); // 전체 데이터 화면에 출력
            } else {
                alert("엑셀 파일에 데이터가 없습니다.");
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // 다중 조건 검색 함수
    function filterData() {
        if (globalData.length === 0) return;

        // 검색어 가져오기 (대소문자 구분을 없애기 위해 소문자로 변환)
        const sProduct = document.getElementById('searchProduct').value.toLowerCase();
        const sLot = document.getElementById('searchLot').value.toLowerCase();
        const sProcess = document.getElementById('searchProcess').value.toLowerCase();
        const sQty = document.getElementById('searchQuantity').value.toLowerCase();

        // 데이터 필터링
        const filtered = globalData.filter(row => {
            // 엑셀의 열 이름(공백 포함 등)에 유연하게 대응하기 위한 값을 찾는 내부 함수
            const getVal = (keyword1, keyword2) => {
                const key = Object.keys(row).find(k => k.includes(keyword1) || (keyword2 && k.toLowerCase().includes(keyword2)));
                return key ? String(row[key]).toLowerCase() : "";
            };

            const valProduct = getVal('제품명', 'product');
            const valLot = getVal('로트', 'lot');
            const valProcess = getVal('공정', 'process');
            const valQty = getVal('수량', 'qty'); // 생산수량, 수량 모두 매칭되게 처리

            // 입력된 검색어가 포함되어 있는지 확인 (AND 조건)
            return valProduct.includes(sProduct) &&
                   valLot.includes(sLot) &&
                   valProcess.includes(sProcess) &&
                   valQty.includes(sQty);
        });

        // 필터링 된 데이터로 표 다시 그리기
        renderTable(filtered);
    }

    // 화면에 표를 그려주는 함수
    function renderTable(data) {
        const thead = document.querySelector('#dataTable thead');
        const tbody = document.querySelector('#dataTable tbody');
        
        thead.innerHTML = '';
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="100%" class="empty-message">검색 결과가 없습니다.</td></tr>';
            return;
        }

        // 테이블 헤더 (<thead>) 생성
        let trHead = document.createElement('tr');
        headers.forEach(h => {
            let th = document.createElement('th');
            th.textContent = h;
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        // 테이블 본문 (<tbody>) 데이터 생성
        data.forEach(row => {
            let tr = document.createElement('tr');
            headers.forEach(h => {
                let td = document.createElement('td');
                td.textContent = row[h]; // 빈 셀도 defval:"" 덕분에 깨끗한 빈칸으로 표시됨
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
