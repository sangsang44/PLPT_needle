<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>주사침 생산현황 통합 검색 대시보드</title>
  <!-- 엑셀 파일 처리를 위한 최신 SheetJS 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; margin: 0; }
    .header { background-color: #2c3e50; color: white; padding: 20px; font-size: 20px; font-weight: bold; }
    .container { padding: 20px; max-width: 1200px; margin: auto; }
    
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-input { flex: 1; padding: 15px; font-size: 16px; border: 2px solid #3498db; border-radius: 8px; box-sizing: border-box; outline: none; }
    .search-input:focus { border-color: #2980b9; }
    
    .file-upload-btn { background-color: #3498db; color: white; border: none; padding: 15px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; min-width: 180px; transition: background 0.2s; }
    .file-upload-btn:hover { background-color: #2980b9; }
    input[type="file"] { display: none; }
    
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background-color: #3498db; color: white; font-size: 15px; }
    tr:hover { background-color: #f1f8ff; }
    .empty-state { text-align: center; padding: 40px; color: #888; font-size: 15px; line-height: 1.6; }
    
    .badge { padding: 5px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; display: inline-block; }
    .badge-done { background-color: #e8f8f5; color: #1abc9c; border: 1px solid #1abc9c; }
    .badge-ing { background-color: #fef9e7; color: #f39c12; border: 1px solid #f39c12; }
    .error-msg { color: #e74c3c; font-weight: bold; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="header">
    💉 주사침 생산현황 통합 검색 대시보드
  </div>
  
  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="제품명, 로트번호, 완료 상태 등을 검색하세요 (예: 3E-20, 264211, 완료)">
      <label class="file-upload-btn">
        📂 엑셀 데이터 추가
        <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" multiple>
      </label>
    </div>
    
    <table id="dataTable">
      <thead>
        <tr>
          <th>제품명</th>
          <th>공정 (로트 번호)</th>
          <th>생산수량</th>
          <th>불량수량</th>
          <th>불량률</th>
          <th>비고 (상태)</th>
        </tr>
      </thead>
      <tbody>
        <tr id="emptyRow">
          <td colspan="6" class="empty-state">
            오른쪽 위의 <b>'엑셀 데이터 추가'</b> 버튼을 눌러 생산일일보고 파일을 올려주세요.<br>
            (여러 날짜의 파일을 동시에 올릴 수 있으며, 데이터는 계속 누적됩니다.)
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const tbody = document.querySelector('#dataTable tbody');
    let isFirstLoad = true;

    document.getElementById('excelUpload').addEventListener('change', async function(e) {
      const files = e.target.files;
      if (files.length === 0) return;

      if (isFirstLoad) {
        tbody.innerHTML = ''; 
        isFirstLoad = false;
      }

      for (let file of files) {
        try {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, {type: 'array'});
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          
          // 헤더 옵션을 1로 설정하여 빈 열도 모두 배열로 가져오기 (결측치 방지)
          const rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});

          let html = '';
          
          // 데이터가 있는 줄 찾기 (보통 4번째 줄부터 시작)
          for(let i = 0; i < rawData.length; i++) {
            const row = rawData[i];
            
            // 제품명(인덱스 1)이 없거나 '제품명'이라는 글자 자체면 건너뛰기
            const productName = String(row[1]).trim();
            if(!productName || productName === '제품명' || productName === '생산 일일 업무보고_주사침팀') continue;

            // 실제 엑셀 열 위치에 맞게 데이터 추출 (인덱스 주의)
            const process = String(row[4]).trim() || '-';
            const prodQty = Number(row[8]) || 0;
            const defectQty = Number(row[9]) || 0;
            
            let defectRate = row[11];
            if (defectRate !== "" && !isNaN(Number(defectRate))) {
                defectRate = (Number(defectRate) * 100).toFixed(2) + '%';
            } else {
                defectRate = '0.00%';
            }
            
            let note = String(row[12]).trim() || '';
            let badgeHtml = note;
            
            // 비고란 내용에 따라 뱃지 적용
            if (note.includes('완료')) {
              badgeHtml = `<span class="badge badge-done">${note}</span>`;
            } else if (note.includes('중간') || note.includes('과정')) {
              badgeHtml = `<span class="badge badge-ing">${note}</span>`;
            }

            html += `
              <tr>
                <td>${productName}</td>
                <td>${process}</td>
                <td>${prodQty.toLocaleString()}</td>
                <td>${defectQty.toLocaleString()}</td>
                <td>${defectRate}</td>
                <td>${badgeHtml}</td>
              </tr>
            `;
          }
          tbody.innerHTML += html;
        } catch (error) {
           console.error("엑셀 읽기 오류:", error);
           tbody.innerHTML += `<tr><td colspan="6" class="error-msg">파일을 읽는 중 오류가 발생했습니다. (${file.name})</td></tr>`;
        }
      }
      this.value = ''; 
    });

    // 통합 검색 기능
    document.getElementById('searchInput').addEventListener('keyup', function() {
      const term = this.value.toLowerCase();
      const rows = document.querySelectorAll('#dataTable tbody tr');
      
      rows.forEach(row => {
        if(row.id === 'emptyRow') return;
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(term) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
