<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사침 생산현황 통합 검색 대시보드</title>
    <!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        
        /* 상단 안내 바 영역 */
        .top-info-bar {
            margin-bottom: 20px;
            background-color: #eef2f5;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            font-size: 14px;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 검색 영역 스타일 (드롭다운) */
        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 0px;
            align-items: flex-end;
            background-color: #fcfcfc;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-radius: 8px 8px 0 0;
            flex-wrap: wrap;
        }
        /* 직접 입력 검색 영역 스타일 */
        .input-search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: flex-end;
            background-color: #f8f9fa;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-top: none;
            border-radius: 0 0 8px 8px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 140px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        .search-section select, .input-search-section input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }
        .button-group {
            display: flex;
            gap: 8px;
            padding-bottom: 2px;
        }
        .btn-search {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
            white-space: nowrap;
        }
        .btn-search:hover { background-color: #2980b9; }
        .btn-reset {
            padding: 10px 18px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
            white-space: nowrap;
        }
        .btn-reset:hover { background-color: #7f8c8d; }

        /* 테이블 및 합계 스타일 */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            max-height: 550px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover { background-color: #f1f6f9; }
        .empty-message {
            text-align: center;
            padding: 25px;
            color: #7f8c8d;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .status-badge {
            background-color: #2ecc71;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* 합계 강조 바 스타일 */
        .summary-bar {
            margin-top: 15px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #117a65;
        }
        .summary-value {
            font-size: 20px;
            color: #0e6251;
        }

        /* 📱 모바일 화면 최적화 */
        @media screen and (max-width: 1100px) {
            body { padding: 5px; }
            .container { padding: 12px; }
            h1 { font-size: 20px; }
            .top-info-bar { flex-direction: column; align-items: flex-start; gap: 5px; font-size: 12px; }
            .search-section, .input-search-section { flex-direction: column; gap: 10px; padding: 12px; }
            .filter-group { width: 100%; }
            .button-group { width: 100%; display: flex; gap: 8px; margin-top: 5px; }
            .button-group button { flex: 1; }
            th, td { padding: 9px 10px; font-size: 13px; }
            .summary-bar { font-size: 14px; padding: 12px 15px; }
            .summary-value { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>주사침 생산현황 통합 검색</h1>
    
    <!-- 상단 안내 바 -->
    <div class="top-info-bar">
        <span>📁 <strong>GitHub 저장소 연동 모드:</strong> 저장소에 업로드된 모든 엑셀 파일(.xlsx)을 자동으로 감지하여 통합 조회합니다.</span>
        <span id="fileCountBadge" style="font-weight: bold; color: #2980b9;">엑셀 파일 스캔 중...</span>
    </div>

    <!-- 1단: 드롭다운 선택 검색 영역 -->
    <div class="search-section">
        <div class="filter-group">
            <label>생산일자 (선택)</label>
            <select id="searchDate" onchange="updateDropdownOptions()">
                <option value="">전체 일자</option>
            </select>
        </div>
        <div class="filter-group">
            <label>제품명 (선택)</label>
            <select id="searchProduct" onchange="updateDropdownOptions()">
                <option value="">전체 제품명</option>
            </select>
        </div>
        <div class="filter-group">
            <label>공정명 (선택)</label>
            <select id="searchProcess" onchange="updateDropdownOptions()">
                <option value="">전체 공정</option>
            </select>
        </div>
        <div class="filter-group">
            <label>로트 번호 (선택)</label>
            <select id="searchLot" onchange="updateDropdownOptions()">
                <option value="">전체 로트</option>
            </select>
        </div>
        <div class="filter-group">
            <label>비고 (선택)</label>
            <select id="searchRemark">
                <option value="">전체 비고</option>
            </select>
        </div>
    </div>

    <!-- 2단: 직접 입력 검색 영역 -->
    <div class="input-search-section">
        <div class="filter-group">
            <label>생산일자 (직접 입력)</label>
            <input type="text" id="inputDate" placeholder="일자/요일 (예: 수)">
        </div>
        <div class="filter-group">
            <label>제품명 (직접 입력)</label>
            <input type="text" id="inputProduct" placeholder="제품명 입력">
        </div>
        <div class="filter-group">
            <label>공정명 (직접 입력)</label>
            <input type="text" id="inputProcess" placeholder="공정명 입력">
        </div>
        <div class="filter-group">
            <label>로트 번호 (직접 입력)</label>
            <input type="text" id="inputLot" placeholder="로트 입력">
        </div>
        <div class="filter-group">
            <label>비고 (직접 입력)</label>
            <input type="text" id="inputRemark" placeholder="비고 입력">
        </div>
        <div class="filter-group">
            <label>상태 (직접 입력)</label>
            <input type="text" id="inputStatus" placeholder="상태 입력 (예: 완료)">
        </div>
        
        <div class="button-group">
            <button class="btn-search" onclick="filterData()">검색</button>
            <button class="btn-reset" onclick="resetSearch()">초기화</button>
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>생산일자</th>
                    <th>제품명</th>
                    <th>공정</th>
                    <th>로트</th>
                    <th class="text-right">생산수량</th>
                    <th>비고</th>
                    <th class="text-center">상태</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="7" class="empty-message">깃허브 저장소에서 데이터를 불러오는 중입니다...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 생산수량 합계 표시 바 -->
    <div class="summary-bar">
        <span>🔍 검색된 조건의 생산현황 요약</span>
        <span class="summary-value" id="totalQtySum">0건 / 0 EA</span>
    </div>
</div>

<script>
    let globalData = [];     

    // GitHub API를 활용해
