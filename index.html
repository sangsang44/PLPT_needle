<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사침 생산현황 통합 검색 대시보드</title>
    <!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .upload-section {
            margin-bottom: 20px;
            padding: 20px;
            background-color: #eef2f5;
            border-radius: 8px;
            text-align: center;
        }
        input[type="file"] {
            font-size: 16px;
        }
        .search-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
            background-color: #fcfcfc;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        .search-section select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }
        .btn-search {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 42px;
        }
        .btn-search:hover {
            background-color: #2980b9;
        }
        .btn-reset {
            padding: 10px 18px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 42px;
        }
        .btn-reset:hover {
            background-color: #7f8c8d;
        }
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            max-height: 600px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover {
            background-color: #f1f6f9;
        }
        .empty-message {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .text-center {
            text-align: center;
        }
        .text-right {
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>주사침 생산현황 통합 검색</h1>
    
    <div class="upload-section">
        <label for="excelFile"><strong>생산현황 엑셀 파일 업로드 (.xlsx) : </strong></label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <!-- 소분류(드롭다운) 연동 검색 영역 -->
    <div class="search-section">
        <div class="filter-group">
            <label>생산일자</label>
            <select id="searchDate" onchange="updateDropdownOptions()">
                <option value="">전체 일자</option>
            </select>
        </div>

        <div class="filter-group">
            <label>제품명</label>
            <select id="searchProduct" onchange="updateDropdownOptions()">
                <option value="">전체 제품명</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>공정명</label>
            <select id="searchProcess" onchange="updateDropdownOptions()">
                <option value="">전체 공정</option>
            </select>
        </div>

        <div class="filter-group">
            <label>로트 번호</label>
            <select id="searchLot" onchange="updateDropdownOptions()">
                <option value="">전체 로트</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>비고/상태</label>
            <select id="searchRemark">
                <option value="">전체 상태</option>
            </select>
        </div>

        <div class="button-group">
            <button class="btn-search" onclick="filterData()">검색</button>
            <button class="btn-reset" onclick="resetSearch()">초기화</button>
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>생산일자</th>
                    <th>제품명</th>
                    <th>공정</th>
                    <th>로트</th>
                    <th class="text-right">생산수량</th>
                    <th>비고</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="empty-message">엑셀 파일을 업로드하면 이곳에 분리된 표가 정리됩니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let globalData = []; 

    function excelDateToJSDate(serial) {
        if (!isNaN(serial) && serial > 30000) {
            let utc_days = Math.floor(serial - 25569);
            let utc_value = utc_days * 86400;
            let date_info = new Date(utc_value * 1000);
            let year = date_info.getUTCFullYear();
            let month = String(date_info.getUTCMonth() + 1).padStart(2, '0');
            let day = String(date_info.getUTCDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        let str = String(serial).trim();
        if (str.includes('T')) str = str.split('T')[0];
        if (str.includes(' ')) str = str.split(' ')[0];
        return str;
    }

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true});
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
            
            globalData = [];
            let currentProdDate = ""; 
            let colIdx = { product: -1, process: -1, qty: -1, remark: -1 };

            for (let i = 0; i < rawData.length; i++) {
                let row = rawData[i].map(cell => String(cell).trim());

                if (row.includes("생산일자")) {
                    let dIdx = row.indexOf("생산일자");
                    if (i + 1 < rawData.length) {
                        let rawDateVal = rawData[i+1][dIdx];
                        if (rawDateVal !== undefined && rawDateVal !== "") {
                            if (rawDateVal instanceof Date) {
                                let year = rawDateVal.getFullYear();
                                let month = String(rawDateVal.getMonth() + 1).padStart(2, '0');
                                let day = String(rawDateVal.getDate()).padStart(2, '0');
                                currentProdDate = `${year}-${month}-${day}`;
                            } else {
                                currentProdDate = excelDateToJSDate(rawDateVal);
                            }
                        }
                    }
                }

                if (row.includes("제품명") && row.includes("공정")) {
                    colIdx.product = row.indexOf("제품명");
                    colIdx.process = row.indexOf("공정");
                    colIdx.qty = row.indexOf("생산수량");
                    colIdx.remark = row.indexOf("비고");
                    
                    for (let j = i + 1; j < rawData.length; j++) {
                        let dataRow = rawData[j];
                        let pName = String(dataRow[colIdx.product] || "").trim();
                        
                        if (!pName || pName === "제품명" || pName.includes("업무보고")) {
                            if (pName.includes("생산 일일 업무보고")) {
                                for (let d = j; d < Math.min(j + 3, rawData.length); d++) {
                                    for (let c = 0; c < rawData[d].length; c++) {
                                        let val = rawData[d][c];
                                        if (val !== undefined && val !== "") {
                                            let sVal = String(val);
                                            if (sVal.includes("2026-") || sVal.includes("2025-") || !isNaN(val) && Number(val) > 40000) {
                                                if (val instanceof Date) {
                                                    currentProdDate = `${val.getFullYear()}-${String(val.getMonth()+1).padStart(2,'0')}-${String(val.getDate()).padStart(2,'0')}`;
                                                } else {
                                                    currentProdDate = excelDateToJSDate(val);
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                            continue;
                        }

                        if (pName === "특이사항") continue;

                        let rawProcessStr = String(dataRow[colIdx.process] || "").trim();
                        let qty = String(dataRow[colIdx.qty] || "").trim();
                        let remark = String(dataRow[colIdx.remark] || "").trim();

                        let cleanProcess = rawProcessStr;
                        let extractedLot = "";

                        let lotMatch = rawProcessStr.match(/\((?:로트\s*[:]?)\s*([^)]+)\)/i);
                        if (lotMatch) {
                            extractedLot = lotMatch[1].trim();
                            cleanProcess = rawProcessStr.replace(lotMatch[0], "").trim();
                        } else {
                            let parts = rawProcessStr.split(/로트[:\s]*/);
                            if (parts.length > 1) {
                                cleanProcess = parts[0].trim();
                                extractedLot = parts[1].replace(/[()]/g, "").trim();
                            }
                        }

                        let formattedQty = qty;
                        let cleanNum = Number(String(qty).replace(/[^0-9.-]+/g,""));
                        if (!isNaN(cleanNum) && qty !== "") {
                            formattedQty = cleanNum.toLocaleString();
                        }

                        globalData.push({
                            "생산일자": currentProdDate || "-",
                            "제품명": pName,
                            "공정": cleanProcess || rawProcessStr,
                            "로트": extractedLot || "-",
                            "생산수량": formattedQty,
                            "비고": remark
                        });
                    }
                }
            }

            if (globalData.length > 0) {
                updateDropdownOptions();
                renderTable(globalData);
            } else {
                alert("엑셀에서 데이터를 추출하지 못했습니다. 파일 구조를 확인해주세요.");
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // 선택된 조건에 맞춰 상호 연동되는 드롭다운 옵션 업데이트 함수
    function updateDropdownOptions() {
        if (globalData.length === 0) return;

        const selDate = document.getElementById('searchDate');
        const selProduct = document.getElementById('searchProduct');
        const selProcess = document.getElementById('searchProcess');
        const selLot = document.getElementById('searchLot');
        const selRemark = document.getElementById('searchRemark');

        const curDate = selDate.value;
        const curProd = selProduct.value;
        const curProc = selProcess.value;
        const curLot = selLot.value;
        const curRem = selRemark.value;

        // 현재 선택된 조건을 제외하고 필터링된 부분집합 추출
        let filterForDropdown = (targetField) => {
            return globalData.filter(row => {
                if (targetField !== '생산일자' && curDate && row['생산일자'] !== curDate) return false;
                if (targetField !== '제품명' && curProd && row['제품명'] !== curProd) return false;
                if (targetField !== '공정' && curProc && row['공정'] !== curProc) return false;
                if (targetField !== '로트' && curLot && row['로트'] !== curLot) return false;
                if (targetField !== '비고' && curRem && row['비고'] !== curRem) return false;
                return true;
            });
        };

        // 각 드롭다운의 고유값 추출
        let dates = [...new Set(filterForDropdown('생산일자').map(r => r['생산일자']))].filter(v => v && v !== '-');
        let products = [...new Set(filterForDropdown('제품명').map(r => r['제품명']))].filter(v => v);
        let processes = [...new Set(filterForDropdown('공정').map(r => r['공정']))].filter(v => v);
        let lots = [...new Set(filterForDropdown('로트').map(r => r['로트']))].filter(v => v && v !== '-');
        let remarks = [...new Set(filterForDropdown('비고').map(r => r['비고']))].filter(v => v);

        // 드롭다운 HTML 갱신 함수 (선택 유지)
        let updateSelectHtml = (element, list, defaultText, currentValue) => {
            element.innerHTML = `<option value="">${defaultText}</option>`;
            list.sort().forEach(item => {
                let selected = (item === currentValue) ? 'selected' : '';
                element.innerHTML += `<option value="${item}" ${selected}>${item}</option>`;
            });
        };

        updateSelectHtml(selDate, dates, '전체 일자', curDate);
        updateSelectHtml(selProduct, products, '전체 제품명', curProd);
        updateSelectHtml(selProcess, processes, '전체 공정', curProc);
        updateSelectHtml(selLot, lots, '전체 로트', curLot);
        updateSelectHtml(selRemark, remarks, '전체 상태', curRem);
    }

    // [검색] 버튼 클릭 시 최종 테이블에 반영하는 함수
    function filterData() {
        if (globalData.length === 0) return;

        const sDate = document.getElementById('searchDate').value;
        const sProduct = document.getElementById('searchProduct').value;
        const sProcess = document.getElementById('searchProcess').value;
        const sLot = document.getElementById('searchLot').value;
        const sRemark = document.getElementById('searchRemark').value;

        const filtered = globalData.filter(row => {
            return (sDate === "" || row['생산일자'] === sDate) &&
                   (sProduct === "" || row['제품명'] === sProduct) &&
                   (sProcess === "" || row['공정'] === sProcess) &&
                   (sLot === "" || row['로트'] === sLot) &&
                   (sRemark === "" || row['비고'] === sRemark);
        });

        renderTable(filtered);
    }

    // [초기화] 버튼
    function resetSearch() {
        document.getElementById('searchDate').value = "";
        document.getElementById('searchProduct').value = "";
        document.getElementById('searchProcess').value = "";
        document.getElementById('searchLot').value = "";
        document.getElementById('searchRemark').value = "";
        updateDropdownOptions();
        renderTable(globalData);
    }

    // 테이블 렌더링
    function renderTable(data) {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-message">조건에 맞는 데이터가 없습니다.</td></tr>';
            return;
        }

        data.forEach(row => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center">${row['생산일자']}</td>
                <td><strong>${row['제품명']}</strong></td>
                <td>${row['공정']}</td>
                <td><span style="background:#eef2f5; padding:3px 8px; border-radius:4px; font-family:monospace;">${row['로트']}</span></td>
                <td class="text-right"><strong>${row['생산수량']}</strong></td>
                <td>${row['비고']}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
