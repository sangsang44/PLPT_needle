<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사침 생산현황 통합 검색 대시보드</title>
    <!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        
        /* 상단 안내 바 영역 */
        .top-info-bar {
            margin-bottom: 20px;
            background-color: #eef2f5;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            font-size: 14px;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 검색 영역 스타일 (드롭다운) */
        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 0px;
            align-items: flex-end;
            background-color: #fcfcfc;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-radius: 8px 8px 0 0;
            flex-wrap: wrap;
        }
        /* 직접 입력 검색 영역 스타일 */
        .input-search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: flex-end;
            background-color: #f8f9fa;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-top: none;
            border-radius: 0 0 8px 8px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 150px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        .search-section select, .input-search-section input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }
        .btn-search {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
        }
        .btn-search:hover { background-color: #2980b9; }
        .btn-reset {
            padding: 10px 18px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
        }
        .btn-reset:hover { background-color: #7f8c8d; }

        /* 테이블 및 합계 스타일 */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            max-height: 550px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover { background-color: #f1f6f9; }
        .empty-message {
            text-align: center;
            padding: 25px;
            color: #7f8c8d;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }

        /* 합계 강조 바 스타일 */
        .summary-bar {
            margin-top: 15px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #117a65;
        }
        .summary-value {
            font-size: 20px;
            color: #0e6251;
        }

        /* 📱 모바일 화면 최적화 */
        @media screen and (max-width: 900px) {
            body { padding: 5px; }
            .container { padding: 12px; }
            h1 { font-size: 20px; }
            .top-info-bar { flex-direction: column; align-items: flex-start; gap: 5px; font-size: 12px; }
            .search-section, .input-search-section { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
            .filter-group { width: 100%; }
            .button-group { width: 100%; display: flex; gap: 8px; margin-top: 5px; }
            .button-group button { flex: 1; }
            th, td { padding: 9px 10px; font-size: 13px; }
            .summary-bar { font-size: 14px; padding: 12px 15px; }
            .summary-value { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>주사침 생산현황 통합 검색</h1>
    
    <!-- 상단 안내 바 -->
    <div class="top-info-bar">
        <span>📁 <strong>GitHub 저장소 연동 모드:</strong> 저장소에 업로드된 모든 엑셀 파일(.xlsx)을 자동으로 감지하여 통합 조회합니다.</span>
        <span id="fileCountBadge" style="font-weight: bold; color: #2980b9;">엑셀 파일 스캔 중...</span>
    </div>

    <!-- 1단: 드롭다운 선택 검색 영역 -->
    <div class="search-section">
        <div class="filter-group">
            <label>생산일자 (선택)</label>
            <select id="searchDate" onchange="updateDropdownOptions()">
                <option value="">전체 일자</option>
            </select>
        </div>

        <div class="filter-group">
            <label>제품명 (선택)</label>
            <select id="searchProduct" onchange="updateDropdownOptions()">
                <option value="">전체 제품명</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>공정명 (선택)</label>
            <select id="searchProcess" onchange="updateDropdownOptions()">
                <option value="">전체 공정</option>
            </select>
        </div>

        <div class="filter-group">
            <label>로트 번호 (선택)</label>
            <select id="searchLot" onchange="updateDropdownOptions()">
                <option value="">전체 로트</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>비고/상태 (선택)</label>
            <select id="searchRemark">
                <option value="">전체 상태</option>
            </select>
        </div>
    </div>

    <!-- 2단: 직접 입력 검색 영역 -->
    <div class="input-search-section">
        <div class="filter-group">
            <label>생산일자 (직접 입력)</label>
            <input type="text" id="inputDate" placeholder="일자 입력 (예: 2026-05)">
        </div>

        <div class="filter-group">
            <label>제품명 (직접 입력)</label>
            <input type="text" id="inputProduct" placeholder="제품명 입력">
        </div>
        
        <div class="filter-group">
            <label>공정명 (직접 입력)</label>
            <input type="text" id="inputProcess" placeholder="공정명 입력">
        </div>

        <div class="filter-group">
            <label>로트 번호 (직접 입력)</label>
            <input type="text" id="inputLot" placeholder="로트 입력">
        </div>
        
        <div class="filter-group">
            <label>비고/상태 (직접 입력)</label>
            <input type="text" id="inputRemark" placeholder="상태 입력">
        </div>

        <div class="button-group">
            <button class="btn-search" onclick="filterData()">검색</button>
            <button class="btn-reset" onclick="resetSearch()">초기화</button>
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>생산일자</th>
                    <th>제품명</th>
                    <th>공정</th>
                    <th>로트</th>
                    <th class="text-right">생산수량</th>
                    <th>비고</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="empty-message">깃허브 저장소에서 데이터를 불러오는 중입니다...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 생산수량 합계 표시 바 -->
    <div class="summary-bar">
        <span>🔍 검색된 조건의 생산수량 총합</span>
        <span class="summary-value" id="totalQtySum">0 EA</span>
    </div>
</div>

<script>
    let globalData = [];     

    const excelFileNames = [
        "생산일일보고_주사침팀 260605.xlsx", "생산일일보고_주사침팀 260612.xlsx",
        "생산일일보고_주사침팀 260619, 20.xlsx", "생산일일보고_주사침팀 260626, 27.xlsx",
        "생산일일보고_주사침팀 260703.xlsx", "생산일일보고_주사침팀 260710.xlsx",
        "생산일일보고_주사침팀 260716.xlsx", "생산일일보고_주사침팀 260724.xlsx",
        "생산일일보고_주사침팀 260731.xlsx", "생산일일보고_주사침팀 260807.xlsx",
        "생산일일보고_주사침팀 260814.xlsx", "생산일일보고_주사침팀 260821.xlsx",
        "생산일일보고_주사침팀 260828.xlsx", "생산일일보고_주사침팀 260901.xlsx",
        "생산일일보고_주사침팀 260904.xlsx", "생산일일보고_주사침팀 260911.xlsx",
        "생산일일보고_주사침팀 260918.xlsx", "생산일일보고_주사침팀 260923.xlsx",
        "생산일일보고_주사침팀 261002.xlsx", "생산일일보고_주사침팀 261008.xlsx",
        "생산일일보고_주사침팀 261016.xlsx", "생산일일보고_주사침팀 261023.xlsx",
        "생산일일보고_주사침팀 261030.xlsx", "생산일일보고_주사침팀 261106.xlsx",
        "생산일일보고_주사침팀 261110.xlsx", "생산일일보고_주사침팀 261111.xlsx"
    ];

    window.onload = function() {
        loadAllGithubExcelFiles();
    };

    function excelDateToJSDate(serial) {
        if (!isNaN(serial) && serial > 30000) {
            let utc_days = Math.floor(serial - 25569);
            let utc_value = utc_days * 86400;
            let date_info = new Date(utc_value * 1000);
            let year = date_info.getUTCFullYear();
            let month = String(date_info.getUTCMonth() + 1).padStart(2, '0');
            let day = String(date_info.getUTCDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        let str = String(serial).trim();
        if (str.includes('T')) str = str.split('T')[0];
        if (str.includes(' ')) str = str.split(' ')[0];
        return str;
    }

    // 상단 "생산일자" 헤더 셀에서 연도와 월을 추출하는 헬퍼 (예: "2026-05-22,23,25" -> 기본 연도/월 파악)
    function parseHeaderDates(dateStr) {
        let datesList = [];
        if (!dateStr) return datesList;
        
        let s = String(dateStr).trim();
        // 날짜 패턴 추출 (예: 2026-05-22,23,25 또는 2026.5.22 등)
        let matchYMD = s.match(/(\d{4})[-年./](\d{1,2})[-月./](\d{1,2})/);
        if (matchYMD) {
            let year = matchYMD[1];
            let month = matchYMD[2].padStart(2, '0');
            
            // 콤마 등으로 이어진 일자들 분리 (예: 22,23,25)
            let parts = s.split(/[,가-힣~\s]+/);
            parts.forEach(p => {
                let dayNum = p.match(/\d{1,2}/);
                if (dayNum) {
                    let day = dayNum[0].padStart(2, '0');
                    datesList.push(`${year}-${month}-${day}`);
                }
            });
        }
        return datesList;
    }

    async function loadAllGithubExcelFiles() {
        try {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            let owner = "";
            let repo = "";

            if (window.location.hostname.includes("github.io")) {
                owner = window.location.hostname.split('.')[0];
                repo = pathSegments.length > 0 ? pathSegments[0] : "";
            }

            let filesToProcess = [];

            if (owner && repo) {
                let apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents`;
                let response = await fetch(apiUrl);
                if (response.ok) {
                    let repoContents = await response.json();
                    filesToProcess = repoContents
                        .filter(item => item.type === 'file' && item.name.endsWith('.xlsx') && item.name.includes('생산일일보고'))
                        .map(item => item.name);
                }
            }

            if (filesToProcess.length === 0) {
                filesToProcess = excelFileNames;
            }

            let rawCombined = [];
            let loadedCount = 0;

            for (let fileName of filesToProcess) {
                try {
                    let res = await fetch(fileName);
                    if (!res.ok) continue;
                    let buffer = await res.arrayBuffer();
                    
                    const workbook = XLSX.read(new Uint8Array(buffer), {type: 'array', cellDates: true});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                    
                    let defaultDates = []; // 상단 헤더에서 파싱한 날짜 목록 (예: [2026-05-22, 2026-05-23, 2026-05-25])
                    let currentProdDate = ""; 
                    let colIdx = { product: -1, process: -1, qty: -1, remark: -1, dateCol: -1 };

                    // 1단계: 상단 생산일자 헤더 탐색
                    for (let i = 0; i < rawData.length; i++) {
                        let row = rawData[i].map(cell => String(cell).trim());
                        if (row.includes("생산일자")) {
                            let dIdx = row.indexOf("생산일자");
                            if (i + 1 < rawData.length) {
                                let rawDateVal = rawData[i+1][dIdx];
                                if (rawDateVal !== undefined && rawDateVal !== "") {
                                    if (rawDateVal instanceof Date) {
                                        let y = rawDateVal.getFullYear();
                                        let m = String(rawDateVal.getMonth() + 1).padStart(2, '0');
                                        let d = String(rawDateVal.getDate()).padStart(2, '0');
                                        currentProdDate = `${y}-${m}-${d}`;
                                        defaultDates = [currentProdDate];
                                    } else {
                                        let parsedList = parseHeaderDates(rawDateVal);
                                        if (parsedList.length > 0) {
                                            defaultDates = parsedList;
                                            currentProdDate = parsedList[0]; // 기본 첫 번째 날짜
                                        } else {
                                            currentProdDate = excelDateToJSDate(rawDateVal);
                                            defaultDates = [currentProdDate];
                                        }
                                    }
                                }
                            }
                            break;
                        }
                    }

                    // 만약 파일 이름에서도 날짜 유추 가능할 경우 보조 처리
                    if (defaultDates.length === 0 && currentProdDate === "") {
                        currentProdDate = "-";
                        defaultDates = ["-"];
                    }

                    // 2단계: 테이블 본문 탐색 및 행별 날짜 추출
                    let activeDate = currentProdDate;
                    let lastValidDate = currentProdDate;

                    for (let i = 0; i < rawData.length; i++) {
                        let row = rawData[i].map(cell => String(cell).trim());

                        if (row.includes("제품명") && row.includes("공정")) {
                            colIdx.product = row.indexOf("제품명");
                            colIdx.process = row.indexOf("공정");
                            colIdx.qty = row.indexOf("생산수량");
                            colIdx.remark = row.indexOf("비고");
                            
                            // 행의 맨 앞쪽(0번~2번 컬럼)에 날짜/요일 정보가 있는지 체크하기 위한 열 탐색
                            // 예: "23일 (토)", "25일 (월)" 등
                            
                            for (let j = i + 1; j < rawData.length; j++) {
                                let dataRow = rawData[j];
                                let pName = String(dataRow[colIdx.product] || "").trim();
                                
                                // 행의 맨 좌측 셀들에서 날짜 정보(예: "23일", "25일")가 있는지 확인
                                for (let c = 0; c < Math.min(colIdx.product, dataRow.length); c++) {
                                    let cellVal = String(dataRow[c] || "").trim();
                                    if (cellVal.includes("일") || cellVal.includes("월") || cellVal.includes("화") || cellVal.includes("수") || cellVal.includes("목") || cellVal.includes("금") || cellVal.includes("토") || cellVal.includes("일")) {
                                        // 예: "23일 (토)" 에서 숫자 추출
                                        let dayMatch = cellVal.match(/(\d{1,2})일/);
                                        if (dayMatch && defaultDates.length > 0) {
                                            let targetDay = dayMatch[1].padStart(2, '0');
                                            // defaultDates 중에서 해당 일이 포함된 날짜를 매칭
                                            let matchedDate = defaultDates.find(dt => dt.endsWith(`-${targetDay}`));
                                            if (matchedDate) {
                                                activeDate = matchedDate;
                                                lastValidDate = matchedDate;
                                            }
                                        }
                                    }
                                }

                                if (!pName || pName === "제품명" || pName.includes("업무보고")) {
                                    if (pName.includes("생산 일일 업무보고")) {
                                        // 새로운 블록 시작 시 날짜 재탐색
                                        for (let d = j; d < Math.min(j + 3, rawData.length); d++) {
                                            for (let col = 0; col < rawData[d].length; col++) {
                                                let val = rawData[d][col];
                                                if (val !== undefined && val !== "") {
                                                    let parsed = parseHeaderDates(val);
                                                    if (parsed.length > 0) {
                                                        defaultDates = parsed;
                                                        activeDate = parsed[0];
                                                        lastValidDate = parsed[0];
                                                    }
                                                }
                                            }
                                        }
                                    }
                                    continue;
                                }

                                if (pName === "특이사항") continue;

                                let rawProcessStr = String(dataRow[colIdx.process] || "").trim();
                                let qty = String(dataRow[colIdx.qty] || "").trim();
                                let remark = String(dataRow[colIdx.remark] || "").trim();

                                let cleanProcess = rawProcessStr;
                                let extractedLot = "";

                                let lotMatch = rawProcessStr.match(/\((?:로트\s*[:]?)\s*([^)]+)\)/i);
                                if (lotMatch) {
                                    extractedLot = lotMatch[1].trim();
                                    cleanProcess = rawProcessStr.replace(lotMatch[0], "").trim();
                                } else {
                                    let parts = rawProcessStr.split(/로트[:\s]*/);
                                    if (parts.length > 1) {
                                        cleanProcess = parts[0].trim();
                                        extractedLot = parts[1].replace(/[()]/g, "").trim();
                                    }
                                }

                                let cleanNum = Number(String(qty).replace(/[^0-9.-]+/g,""));
                                let numericQty = !isNaN(cleanNum) ? cleanNum : 0;

                                rawCombined.push({
                                    "생산일자": activeDate || lastValidDate || "-",
                                    "제품명": pName,
                                    "공정": cleanProcess || rawProcessStr,
                                    "로트": extractedLot || "-",
                                    "생산수량": numericQty,
                                    "비고": remark
                                });
                            }
                        }
                    }
                    loadedCount++;
                } catch(err) {
                    console.error("파일 로드 실패:", fileName);
                }
            }

            let uniqueMap = new Map();
            rawCombined.forEach(item => {
                let key = `${item['생산일자']}_${item['제품명']}_${item['공정']}_${item['로트']}_${item['생산수량']}_${item['비고']}`;
                uniqueMap.set(key, item);
            });
            globalData = Array.from(uniqueMap.values());
            globalData.sort((a, b) => b['생산일자'].localeCompare(a['생산일자']));

            document.getElementById('fileCountBadge').textContent = `자동 연동된 파일: ${loadedCount}개`;
            updateDropdownOptions();
            renderTable(globalData);

        } catch (e) {
            console.error("자동 파일 스캔 오류:", e);
            document.getElementById('fileCountBadge').textContent = `파일 연동 오류 발생`;
        }
    }

    window.onload = function() {
        loadAllGithubExcelFiles();
    };

    function excelDateToJSDate(serial) {
        if (!isNaN(serial) && serial > 30000) {
            let utc_days = Math.floor(serial - 25569);
            let utc_value = utc_days * 86400;
            let date_info = new Date(utc_value * 1000);
            let year = date_info.getUTCFullYear();
            let month = String(date_info.getUTCMonth() + 1).padStart(2, '0');
            let day = String(date_info.getUTCDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        let str = String(serial).trim();
        if (str.includes('T')) str = str.split('T')[0];
        if (str.includes(' ')) str = str.split(' ')[0];
        return str;
    }

    function updateDropdownOptions() {
        if (globalData.length === 0) return;

        const selDate = document.getElementById('searchDate');
        const selProduct = document.getElementById('searchProduct');
        const selProcess = document.getElementById('searchProcess');
        const selLot = document.getElementById('searchLot');
        const selRemark = document.getElementById('searchRemark');

        const curDate = selDate.value;
        const curProd = selProduct.value;
        const curProc = selProcess.value;
        const curLot = selLot.value;
        const curRem = selRemark.value;

        let filterForDropdown = (targetField) => {
            return globalData.filter(row => {
                if (targetField !== '생산일자' && curDate && row['생산일자'] !== curDate) return false;
                if (targetField !== '제품명' && curProd && row['제품명'] !== curProd) return false;
                if (targetField !== '공정' && curProc && row['공정'] !== curProc) return false;
                if (targetField !== '로트' && curLot && row['로트'] !== curLot) return false;
                if (targetField !== '비고' && curRem && row['비고'] !== curRem) return false;
                return true;
            });
        };

        let dates = [...new Set(filterForDropdown('생산일자').map(r => r['생산일자']))].filter(v => v && v !== '-');
        let products = [...new Set(filterForDropdown('제품명').map(r => r['제품명']))].filter(v => v);
        let processes = [...new Set(filterForDropdown('공정').map(r => r['공정']))].filter(v => v);
        let lots = [...new Set(filterForDropdown('로트').map(r => r['로트']))].filter(v => v && v !== '-');
        let remarks = [...new Set(filterForDropdown('비고').map(r => r['비고']))].filter(v => v);

        dates.sort().reverse();
        products.sort();
        processes.sort();
        lots.sort();
        remarks.sort();

        let updateSelectHtml = (element, list, defaultText, currentValue) => {
            element.innerHTML = `<option value="">${defaultText}</option>`;
            list.forEach(item => {
                let selected = (item === currentValue) ? 'selected' : '';
                element.innerHTML += `<option value="${item}" ${selected}>${item}</option>`;
            });
        };

        updateSelectHtml(selDate, dates, '전체 일자', curDate);
        updateSelectHtml(selProduct, products, '전체 제품명', curProd);
        updateSelectHtml(selProcess, processes, '전체 공정', curProc);
        updateSelectHtml(selLot, lots, '전체 로트', curLot);
        updateSelectHtml(selRemark, remarks, '전체 상태', curRem);
    }

    function filterData() {
        if (globalData.length === 0) return;

        const sDate = document.getElementById('searchDate').value;
        const sProduct = document.getElementById('searchProduct').value;
        const sProcess = document.getElementById('searchProcess').value;
        const sLot = document.getElementById('searchLot').value;
        const sRemark = document.getElementById('searchRemark').value;

        const iDate = document.getElementById('inputDate').value.toLowerCase().trim();
        const iProduct = document.getElementById('inputProduct').value.toLowerCase().trim();
        const iProcess = document.getElementById('inputProcess').value.toLowerCase().trim();
        const iLot = document.getElementById('inputLot').value.toLowerCase().trim();
        const iRemark = document.getElementById('inputRemark').value.toLowerCase().trim();

        const filtered = globalData.filter(row => {
            if (sDate && row['생산일자'] !== sDate) return false;
            if (sProduct && row['제품명'] !== sProduct) return false;
            if (sProcess && row['공정'] !== sProcess) return false;
            if (sLot && row['로트'] !== sLot) return false;
            if (sRemark && row['비고'] !== sRemark) return false;

            if (iDate && !row['생산일자'].toLowerCase().includes(iDate)) return false;
            if (iProduct && !row['제품명'].toLowerCase().includes(iProduct)) return false;
            if (iProcess && !row['공정'].toLowerCase().includes(iProcess)) return false;
            if (iLot && !row['로트'].toLowerCase().includes(iLot)) return false;
            if (iRemark && !row['비고'].toLowerCase().includes(iRemark)) return false;

            return true;
        });

        renderTable(filtered);
    }

    function resetSearch() {
        document.getElementById('searchDate').value = "";
        document.getElementById('searchProduct').value = "";
        document.getElementById('searchProcess').value = "";
        document.getElementById('searchLot').value = "";
        document.getElementById('searchRemark').value = "";

        document.getElementById('inputDate').value = "";
        document.getElementById('inputProduct').value = "";
        document.getElementById('inputProcess').value = "";
        document.getElementById('inputLot').value = "";
        document.getElementById('inputRemark').value = "";

        updateDropdownOptions();
        renderTable(globalData);
    }

    function renderTable(data) {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        let sumQty = 0;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-message">조건에 맞는 데이터가 없습니다.</td></tr>';
            document.getElementById('totalQtySum').textContent = '0 EA';
            return;
        }

        let sortedData = [...data].sort((a, b) => b['생산일자'].localeCompare(a['생산일자']));

        sortedData.forEach(row => {
            sumQty += row['생산수량'];
            let formattedQty = row['생산수량'].toLocaleString();

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center">${row['생산일자']}</td>
                <td><strong>${row['제품명']}</strong></td>
                <td>${row['공정']}</td>
                <td><span style="background:#eef2f5; padding:3px 8px; border-radius:4px; font-family:monospace;">${row['로트']}</span></td>
                <td class="text-right"><strong>${formattedQty}</strong></td>
                <td>${row['비고']}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('totalQtySum').textContent = sumQty.toLocaleString() + ' EA';
    }
</script>
