<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>주사침 생산현황 검색</title>
  <!-- 엑셀 파일을 읽어오기 위한 외부 도구 (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; margin: 0; }
    .header { background-color: #2c3e50; color: white; padding: 20px; font-size: 20px; font-weight: bold; }
    .container { padding: 20px; max-width: 1200px; margin: auto; }
    .search-input { width: 100%; padding: 15px; font-size: 16px; border: 2px solid #3498db; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background-color: #3498db; color: white; font-size: 15px; }
    tr:hover { background-color: #f1f8ff; }
    .loading { text-align: center; padding: 20px; color: #888; }
  </style>
</head>
<body>
  <div class="header">
    💉 주사침 생산현황 검색 대시보드
  </div>
  
  <div class="container">
    <!-- 검색창 -->
    <input type="text" id="searchInput" class="search-input" placeholder="제품명, 로트번호, 공정 등을 검색하세요 (예: 3E-20, 264211)">
    
    <!-- 데이터 표 -->
    <table id="dataTable">
      <thead>
        <tr>
          <th>제품명</th>
          <th>공정 (로트 번호)</th>
          <th>생산수량</th>
          <th>불량수량</th>
          <th>불량률</th>
          <th>비고</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="6" class="loading">엑셀 데이터를 불러오는 중입니다...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // 1. 깃허브에 함께 올라간 엑셀 파일 이름 지정 (띄어쓰기 주의)
    const EXCEL_FILE_NAME = './생산일일보고_주사침팀 261110.xlsx';

    // 2. 엑셀 데이터 불러오기 함수
    async function loadExcelData() {
      try {
        const response = await fetch(EXCEL_FILE_NAME);
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, {type: 'array'});
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

        const tbody = document.querySelector('#dataTable tbody');
        let html = '';

        // 엑셀 표에서 실제 데이터가 시작되는 4번째 줄(인덱스 3)부터 반복
        for(let i = 3; i < rawData.length; i++) {
          const row = rawData[i];
          if(!row || !row[1]) continue; // 빈 줄 건너뛰기

          const productName = row[1] || '';
          const process = row[4] || '';
          const prodQty = row[8] || 0;
          const defectQty = row[9] || 0;
          let defectRate = row[11] || 0;
          if(typeof defectRate === 'number') defectRate = (defectRate * 100).toFixed(2) + '%';
          const note = row[12] || '';

          html += `
            <tr>
              <td>${productName}</td>
              <td>${process}</td>
              <td>${prodQty.toLocaleString()}</td>
              <td>${defectQty.toLocaleString()}</td>
              <td>${defectRate}</td>
              <td>${note}</td>
            </tr>
          `;
        }
        tbody.innerHTML = html;
      } catch (error) {
        document.querySelector('#dataTable tbody').innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">데이터를 불러오지 못했습니다. 엑셀 파일 이름('${EXCEL_FILE_NAME}')이 깃허브에 올라간 이름과 똑같은지 확인해주세요.</td></tr>`;
      }
    }

    // 3. 검색 기능 구현
    document.getElementById('searchInput').addEventListener('keyup', function() {
      const term = this.value.toLowerCase();
      const rows = document.querySelectorAll('#dataTable tbody tr');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(term) ? '' : 'none';
      });
    });

    // 시작할 때 데이터 불러오기 실행
    loadExcelData();
  </script>
</body>
</html>
