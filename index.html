<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사침 생산현황 통합 검색 대시보드</title>
    <!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        
        /* 상단 안내 바 영역 */
        .top-info-bar {
            margin-bottom: 20px;
            background-color: #eef2f5;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            font-size: 14px;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 검색 영역 스타일 (드롭다운) */
        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 0px;
            align-items: flex-end;
            background-color: #fcfcfc;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-radius: 8px 8px 0 0;
            flex-wrap: wrap;
        }
        /* 직접 입력 검색 영역 스타일 */
        .input-search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: flex-end;
            background-color: #f8f9fa;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-top: none;
            border-radius: 0 0 8px 8px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 130px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        .search-section select, .input-search-section input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }
        .btn-search {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
        }
        .btn-search:hover { background-color: #2980b9; }
        .btn-reset {
            padding: 10px 18px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
        }
        .btn-reset:hover { background-color: #7f8c8d; }

        /* 테이블 및 합계 스타일 */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            max-height: 550px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover { background-color: #f1f6f9; }
        .empty-message {
            text-align: center;
            padding: 25px;
            color: #7f8c8d;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }

        /* 합계 강조 바 스타일 */
        .summary-bar {
            margin-top: 15px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #117a65;
        }
        .summary-value {
            font-size: 20px;
            color: #0e6251;
        }

        /* 📱 모바일 화면 최적화 (화면 폭 900px 이하일 때 자동 적용) */
        @media screen and (max-width: 900px) {
            body {
                padding: 5px;
            }
            .container {
                padding: 12px;
            }
            h1 {
                font-size: 20px;
            }
            .top-info-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
                font-size: 12px;
            }
            .search-section, .input-search-section {
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 12px;
            }
            .filter-group {
                width: 100%;
            }
            .button-group {
                width: 100%;
                display: flex;
                gap: 8px;
                margin-top: 5px;
            }
            .button-group button {
                flex: 1;
            }
            th, td {
                padding: 9px 10px;
                font-size: 13px;
            }
            .summary-bar {
                font-size: 14px;
                padding: 12px 15px;
            }
            .summary-value {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>주사침 생산현황 통합 검색</h1>
    
    <!-- 상단 안내 바 -->
    <div class="top-info-bar">
        <span>📁 <strong>GitHub 저장소 연동 모드:</strong> 저장소에 업로드된 모든 엑셀 파일(.xlsx)을 자동으로 감지하여 통합 조회합니다.</span>
        <span id="fileCountBadge" style="font-weight: bold; color: #2980b9;">엑셀 파일 스캔 중...</span>
    </div>

    <!-- 1단: 드롭다운 선택 검색 영역 -->
    <div class="search-section">
        <div class="filter-group">
            <label>생산일자 (선택)</label>
            <select id="searchDate" onchange="updateDropdownOptions()">
                <option value="">전체 일자</option>
            </select>
        </div>

        <div class="filter-group">
            <label>제품명 (선택)</label>
            <select id="searchProduct" onchange="updateDropdownOptions()">
                <option value="">전체 제품명</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>공정명 (선택)</label>
            <select id="searchProcess" onchange="updateDropdownOptions()">
                <option value="">전체 공정</option>
            </select>
        </div>

        <div class="filter-group">
            <label>로트 번호 (선택)</label>
            <select id="searchLot" onchange="updateDropdownOptions()">
                <option value="">전체 로트</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>비고 (선택)</label>
            <select id="searchRemark" onchange="updateDropdownOptions()">
                <option value="">전체 비고</option>
            </select>
        </div>

        <div class="filter-group">
            <label>상태 (선택)</label>
            <select id="searchStatus" onchange="updateDropdownOptions()">
                <option value="">전체 상태</option>
            </select>
        </div>
    </div>

    <!-- 2단: 직접 입력 검색 영역 -->
    <div class="input-search-section">
        <div class="filter-group">
            <label>생산일자 (직접 입력)</label>
            <input type="text" id="inputDate" placeholder="입력 (예: 26-11 또는 수)">
        </div>

        <div class="filter-group">
            <label>제품명 (직접 입력)</label>
            <input type="text" id="inputProduct" placeholder="제품명 입력">
        </div>
        
        <div class="filter-group">
            <label>공정명 (직접 입력)</label>
            <input type="text" id="inputProcess" placeholder="공정명 입력">
        </div>

        <div class="filter-group">
            <label>로트 번호 (직접 입력)</label>
            <input type="text" id="inputLot" placeholder="로트 입력">
        </div>
        
        <div class="filter-group">
            <label>비고 (직접 입력)</label>
            <input type="text" id="inputRemark" placeholder="비고 입력">
        </div>

        <div class="filter-group">
            <label>상태 (직접 입력)</label>
            <input type="text" id="inputStatus" placeholder="상태 입력 (예: 완료)">
        </div>

        <div class="button-group">
            <button class="btn-search" onclick="filterData()">검색</button>
            <button class="btn-reset" onclick="resetSearch()">초기화</button>
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>생산일자</th>
                    <th>제품명</th>
                    <th>공정</th>
                    <th>로트</th>
                    <th class="text-right">생산수량</th>
                    <th>비고</th>
                    <th>상태</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="7" class="empty-message">깃허브 저장소에서 데이터를 불러오는 중입니다...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 생산수량 합계 표시 바 -->
    <div class="summary-bar">
        <span>🔍 검색된 조건의 생산현황 요약</span>
        <span class="summary-value" id="totalQtySum">0건 / 0 EA</span>
    </div>
</div>

<script>
    let globalData = [];     

    // 파일 이름에서 날짜 추출 헬퍼 함수 추가 (예: "생산일일보고_주사침팀 261102.xlsx" -> "2026-11-02")
    function extractDateFromFilename(filename) {
        const match = filename.match(/(\d{2})(\d{2})(\d{2})/);
        if (match) {
            let yy = "20" + match[1];
            let mm = match[2];
            let dd = match[3];
            return `${yy}-${mm}-${dd}`;
        }
        return "";
    }

    // GitHub API를 활용해 저장소의 모든 파일을 자동 스캔하고, 실패 시 최신 날짜까지 포함된 목록으로 자동 대응
    async function loadAllGithubExcelFiles() {
        try {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            let owner = "";
            let repo = "";

            if (window.location.hostname.includes("github.io")) {
                owner = window.location.hostname.split('.')[0];
                repo = pathSegments.length > 0 ? pathSegments[0] : "";
            }

            let filesToProcess = [];

            if (owner && repo) {
                let apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents`;
                let response = await fetch(apiUrl);
                if (response.ok) {
                    let repoContents = await response.json();
                    filesToProcess = repoContents
                        .filter(item => item.type === 'file' && item.name.endsWith('.xlsx') && item.name.includes('생산일일보고'))
                        .map(item => item.name);
                }
            }

            // GitHub API 호출 제한 등에 대비한 확장된 파일 목록 (금요일 파일들 포함)
            if (filesToProcess.length === 0) {
                filesToProcess = [
                    "생산일일보고_주사침팀 260109.xlsx", "생산일일보고_주사침팀 260116.xlsx",
                    "생산일일보고_주사침팀 260123.xlsx", "생산일일보고_주사침팀 260130.xlsx",
                    "생산일일보고_주사침팀 260206.xlsx", "생산일일보고_주사침팀 260605.xlsx",
                    "생산일일보고_주사침팀 260612.xlsx", "생산일일보고_주사침팀 260619, 20.xlsx",
                    "생산일일보고_주사침팀 260626, 27.xlsx", "생산일일보고_주사침팀 260703.xlsx",
                    "생산일일보고_주사침팀 260710.xlsx", "생산일일보고_주사침팀 260716.xlsx",
                    "생산일일보고_주사침팀 260724.xlsx", "생산일일보고_주사침팀 260731.xlsx",
                    "생산일일보고_주사침팀 260807.xlsx", "생산일일보고_주사침팀 260814.xlsx",
                    "생산일일보고_주사침팀 260821.xlsx", "생산일일보고_주사침팀 260828.xlsx",
                    "생산일일보고_주사침팀 260901.xlsx", "생산일일보고_주사침팀 260904.xlsx",
                    "생산일일보고_주사침팀 260911.xlsx", "생산일일보고_주사침팀 260918.xlsx",
                    "생산일일보고_주사침팀 260923.xlsx", "생산일일보고_주사침팀 261002.xlsx",
                    "생산일일보고_주사침팀 261008.xlsx", "생산일일보고_주사침팀 261016.xlsx",
                    "생산일일보고_주사침팀 261023.xlsx", "생산일일보고_주사침팀 261030.xlsx",
                    "생산일일보고_주사침팀 261106.xlsx", "생산일일보고_주사침팀 261110.xlsx",
                    "생산일일보고_주사침팀 261111.xlsx", "생산일일보고_주사침팀 261116.xlsx"
                ];
            }

            let rawCombined = [];
            let loadedCount = 0;

            for (let fileName of filesToProcess) {
                try {
                    let res = await fetch(fileName);
                    if (!res.ok) continue;
                    let buffer = await res.arrayBuffer();
                    
                    const workbook = XLSX.read(new Uint8Array(buffer), {type: 'array', cellDates: true});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                    
                    // 파일 이름 기반 기본 날짜 사전 설정 (내부 셀 파싱 실패 시 폴백 및 날짜 꼬임 방지)
                    let fileBaseDate = extractDateFromFilename(fileName);
                    let currentProdDate = fileBaseDate; 
                    let colIdx = { product: -1, process: -1, lot: -1, qty: -1, remark: -1, status: -1 };

                    for (let i = 0; i < rawData.length; i++) {
                        let row = rawData[i].map(cell => String(cell).trim());

                        // [보완된 날짜 탐색 로직] 유효한 날짜를 명확히 찾았을 때만 갱신
                        if (row.includes("생산일자") || row.includes("날짜")) {
                            let foundDate = "";
                            for (let rOffset = 0; rOffset <= 1; rOffset++) {
                                if (i + rOffset < rawData.length) {
                                    let targetRow = rawData[i + rOffset];
                                    for (let cVal of targetRow) {
                                        if (cVal !== undefined && cVal !== "") {
                                            if (cVal instanceof Date) {
                                                foundDate = `${cVal.getFullYear()}-${String(cVal.getMonth() + 1).padStart(2, '0')}-${String(cVal.getDate()).padStart(2, '0')}`;
                                                break;
                                            } else {
                                                let converted = excelDateToJSDate(cVal);
                                                if (converted && converted.includes("202")) {
                                                    foundDate = converted;
                                                    break;
                                                }
                                            }
                                        }
                                    }
                                }
                                if (foundDate) break;
                            }
                            if (foundDate) {
                                currentProdDate = foundDate;
                            }
                        }

                        if (row.includes("제품명") && row.includes("공정")) {
                            colIdx.product = row.indexOf("제품명");
                            colIdx.process = row.indexOf("공정");
                            colIdx.lot = row.indexOf("로트");
                            colIdx.qty = row.indexOf("생산수량");
                            colIdx.remark = row.indexOf("비고");
                            colIdx.status = row.indexOf("상태");
                            
                            for (let j = i + 1; j < rawData.length; j++) {
                                let dataRow = rawData[j];
                                let pName = String(dataRow[colIdx.product] || "").trim();
                                
                                if (!pName || pName === "제품명" || pName.includes("업무보고")) {
                                    if (pName.includes("생산 일일 업무보고")) {
                                        for (let d = j; d < Math.min(j + 3, rawData.length); d++) {
                                            for (let c = 0; c < rawData[d].length; c++) {
                                                let val = rawData[d][c];
                                                if (val !== undefined && val !== "") {
                                                    let sVal = String(val);
                                                    if (sVal.includes("2026-") || sVal.includes("2025-") || !isNaN(val) && Number(val) > 40000) {
                                                        if (val instanceof Date) {
                                                            let subDate = `${val.getFullYear()}-${String(val.getMonth()+1).padStart(2,'0')}-${String(val.getDate()).padStart(2,'0')}`;
                                                            if (subDate) currentProdDate = subDate;
                                                        } else {
                                                            let convertedSub = excelDateToJSDate(val);
                                                            if (convertedSub && convertedSub.includes("202")) {
                                                                currentProdDate = convertedSub;
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                    continue;
                                }

                                if (pName === "특이사항") continue;

                                let rawProcessStr = String(dataRow[colIdx.process] || "").trim();
                                let qty = String(dataRow[colIdx.qty] || "").trim();
                                let rawRemark = colIdx.remark !== -1 ? String(dataRow[colIdx.remark] || "").trim() : "";
                                let rawStatus = colIdx.status !== -1 ? String(dataRow[colIdx.status] || "").trim() : "";

                                let cleanProcess = rawProcessStr;
                                let extractedLot = (colIdx.lot !== -1 && dataRow[colIdx.lot] !== undefined) ? String(dataRow[colIdx.lot]).trim() : "";

                                let lotMatch = rawProcessStr.match(/\((?:로트\s*[:]?)\s*([^)]+)\)/i);
                                if (lotMatch) {
                                    if (!extractedLot) extractedLot = lotMatch[1].trim();
                                    cleanProcess = rawProcessStr.replace(lotMatch[0], "").trim();
                                } else {
                                    let parts = rawProcessStr.split(/로트[:\s]*/);
                                    if (parts.length > 1) {
                                        cleanProcess = parts[0].trim();
                                        if (!extractedLot) extractedLot = parts[1].replace(/[()]/g, "").trim();
                                    }
                                }

                                let finalStatus = "";
                                if (rawRemark.includes("완료") || rawStatus.includes("완료")) {
                                    finalStatus = "완료";
                                }

                                let finalRemark = rawRemark
                                    .replace(/\(\s*완료\s*\)/g, "")
                                    .replace(/\[\s*완료\s*\]/g, "")
                                    .replace(/완료/g, "")
                                    .replace(/^[\s,\/-]+|[\s,\/-]+$/g, "")
                                    .trim();

                                let cleanNum = Number(String(qty).replace(/[^0-9.-]+/g,""));
                                let numericQty = !isNaN(cleanNum) ? cleanNum : 0;

                                rawCombined.push({
                                    "생산일자": currentProdDate || fileBaseDate || "-",
                                    "제품명": pName,
                                    "공정": cleanProcess || rawProcessStr,
                                    "로트": extractedLot || "-",
                                    "생산수량": numericQty,
                                    "비고": finalRemark,
                                    "상태": finalStatus
                                });
                            }
                        }
                    }
                    loadedCount++;
                } catch(err) {
                    console.error("파일 로드 실패:", fileName);
                }
            }

            // [중복 제거 로직 보완] 동일한 로트/공정/제품/수량 등 핵심 데이터가 날짜만 다르게 중복 적재되는 현상 방지
            let uniqueMap = new Map();
            rawCombined.forEach(item => {
                let key = `${item['생산일자']}_${item['제품명']}_${item['공정']}_${item['로트']}_${item['생산수량']}_${item['비고']}_${item['상태']}`;
                uniqueMap.set(key, item);
            });
            globalData = Array.from(uniqueMap.values());
            globalData.sort((a, b) => b['생산일자'].localeCompare(a['생산일자']));

            document.getElementById('fileCountBadge').textContent = `자동 연동된 파일: ${loadedCount}개`;
            updateDropdownOptions();
            renderTable(globalData);

            const inputFields = document.querySelectorAll('.input-search-section input');
            inputFields.forEach(input => {
                input.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        filterData();
                    }
                });
            });

        } catch (e) {
            console.error("자동 파일 스캔 오류:", e);
            document.getElementById('fileCountBadge').textContent = `파일 연동 오류 발생`;
        }
    }

    window.onload = function() {
        loadAllGithubExcelFiles();
    };

    function excelDateToJSDate(serial) {
        if (!isNaN(serial) && serial > 30000) {
            let utc_days = Math.floor(serial - 25569);
            let utc_value = utc_days * 86400;
            let date_info = new Date(utc_value * 1000);
            let year = date_info.getUTCFullYear();
            let month = String(date_info.getUTCMonth() + 1).padStart(2, '0');
            let day = String(date_info.getUTCDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        let str = String(serial).trim();
        if (str.includes('T')) str = str.split('T')[0];
        if (str.includes(' ')) str = str.split(' ')[0];
        return str;
    }

    function dateToString(d) {
        let y = d.getFullYear();
        let m = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function getLunarHolidayDates(year) {
        const knownLunarDays = {
            2024: { seol: "2024-02-10", chuseok: "2024-09-17" },
            2025: { seol: "2025-01-29", chuseok: "2025-10-06" },
            2026: { seol: "2026-02-17", chuseok: "2026-09-25" },
            2027: { seol: "2027-02-06", chuseok: "2027-09-15" },
            2028: { seol: "2028-01-26", chuseok: "2028-10-03" },
            2029: { seol: "2029-02-13", chuseok: "2029-09-22" },
            2030: { seol: "2030-02-03", chuseok: "2030-09-12" }
        };

        let seolDateStr, chuseokDateStr;

        if (knownLunarDays[year]) {
            seolDateStr = knownLunarDays[year].seol;
            chuseokDateStr = knownLunarDays[year].chuseok;
        } else {
            let baseYear = 2026;
            let diffYears = year - baseYear;
            let seol = new Date(2026, 1, 17);
            seol.setDate(seol.getDate() + Math.round(diffYears * 354.367 % 365.2422));
            seolDateStr = dateToString(seol);

            let chuseok = new Date(2026, 8, 25);
            chuseok.setDate(chuseok.getDate() + Math.round(diffYears * 354.367 % 365.2422));
            chuseokDateStr = dateToString(chuseok);
        }

        let dates = [];

        let sDate = new Date(seolDateStr);
        for (let i = -1; i <= 1; i++) {
            let d = new Date(sDate);
            d.setDate(sDate.getDate() + i);
            dates.push(dateToString(d));
        }

        let cDate = new Date(chuseokDateStr);
        for (let i = -1; i <= 1; i++) {
            let d = new Date(cDate);
            d.setDate(cDate.getDate() + i);
            dates.push(dateToString(d));
        }

        return dates;
    }

    function getKoreanHolidays(year) {
        let holidays = new Set();

        const fixedHolidays = [
            `${year}-01-01`, `${year}-03-01`, `${year}-05-01`,
            `${year}-05-05`, `${year}-06-06`, `${year}-08-15`,
            `${year}-10-03`, `${year}-10-09`, `${year}-12-25`
        ];
        fixedHolidays.forEach(h => holidays.add(h));

        let lunarHolidays = getLunarHolidayDates(year);
        lunarHolidays.forEach(h => holidays.add(h));

        let checkAndAddAltHoliday = (dateStr) => {
            let d = new Date(dateStr);
            if (!isNaN(d.getTime()) && d.getDay() === 0) {
                let nextDay = new Date(d);
                nextDay.setDate(d.getDate() + 1);
                let nextStr = dateToString(nextDay);
                while (holidays.has(nextStr) || nextDay.getDay() === 0) {
                    nextDay.setDate(nextDay.getDate() + 1);
                    nextStr = dateToString(nextDay);
                }
                holidays.add(nextStr);
            }
        };

        fixedHolidays.forEach(h => checkAndAddAltHoliday(h));
        lunarHolidays.forEach(h => checkAndAddAltHoliday(h));

        return holidays;
    }

    function formatDateWithDayAndColor(dateStr) {
        if (!dateStr || dateStr === '-') return { text: '-', color: 'inherit', dayStr: '' };
        
        let parts = dateStr.split('-');
        if (parts.length !== 3) return { text: dateStr, color: 'inherit', dayStr: '' };

        let year = Number(parts[0]);
        let month = Number(parts[1]);
        let day = Number(parts[2]);

        let dateObj = new Date(year, month - 1, day);
        if (isNaN(dateObj.getTime())) return { text: dateStr, color: 'inherit', dayStr: '' };

        const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
        let dayOfWeek = weekDays[dateObj.getDay()];
        let formattedText = `${dateStr} (${dayOfWeek})`;

        let holidays = getKoreanHolidays(year);
        let color = 'inherit';
        let dayNum = dateObj.getDay();

        if (dayNum === 0 || holidays.has(dateStr)) {
            color = '#e74c3c';
        } else if (dayNum === 6) {
            color = '#3498db';
        }

        return { text: formattedText, color: color, dayStr: dayOfWeek };
    }

    function updateDropdownOptions() {
        if (globalData.length === 0) return;

        const selDate = document.getElementById('searchDate');
        const selProduct = document.getElementById('searchProduct');
        const selProcess = document.getElementById('searchProcess');
        const selLot = document.getElementById('searchLot');
        const selRemark = document.getElementById('searchRemark');
        const selStatus = document.getElementById('searchStatus');

        const curDate = selDate.value;
        const curProd = selProduct.value;
        const curProc = selProcess.value;
        const curLot = selLot.value;
        const curRem = selRemark.value;
        const curStat = selStatus.value;

        let filterForDropdown = (targetField) => {
            return globalData.filter(row => {
                if (targetField !== '생산일자' && curDate && row['생산일자'] !== curDate) return false;
                if (targetField !== '제품명' && curProd && row['제품명'] !== curProd) return false;
                if (targetField !== '공정' && curProc && row['공정'] !== curProc) return false;
                if (targetField !== '로트' && curLot && row['로트'] !== curLot) return false;
                if (targetField !== '비고' && curRem && row['비고'] !== curRem) return false;
                if (targetField !== '상태' && curStat && row['상태'] !== curStat) return false;
                return true;
            });
        };

        let rawDates = [...new Set(filterForDropdown('생산일자').map(r => r['생산일자']))].filter(v => v && v !== '-');
        rawDates.sort().reverse();

        selDate.innerHTML = `<option value="">전체 일자</option>`;
        rawDates.forEach(dVal => {
            let info = formatDateWithDayAndColor(dVal);
            let selected = (dVal === curDate) ? 'selected' : '';
            selDate.innerHTML += `<option value="${dVal}" ${selected}>${info.text}</option>`;
        });

        let products = [...new Set(filterForDropdown('제품명').map(r => r['제품명']))].filter(v => v);
        let processes = [...new Set(filterForDropdown('공정').map(r => r['공정']))].filter(v => v);
        let lots = [...new Set(filterForDropdown('로트').map(r => r['로트']))].filter(v => v && v !== '-');
        let remarks = [...new Set(filterForDropdown('비고').map(r => r['비고']))].filter(v => v);
        let statuses = [...new Set(filterForDropdown('상태').map(r => r['상태']))].filter(v => v);

        products.sort();
        processes.sort();
        lots.sort();
        remarks.sort();
        statuses.sort();

        let updateSelectHtml = (element, list, defaultText, currentValue) => {
            element.innerHTML = `<option value="">${defaultText}</option>`;
            list.forEach(item => {
                let selected = (item === currentValue) ? 'selected' : '';
                element.innerHTML += `<option value="${item}" ${selected}>${item}</option>`;
            });
        };

        updateSelectHtml(selProduct, products, '전체 제품명', curProd);
        updateSelectHtml(selProcess, processes, '전체 공정', curProc);
        updateSelectHtml(selLot, lots, '전체 로트', curLot);
        updateSelectHtml(selRemark, remarks, '전체 비고', curRem);
        updateSelectHtml(selStatus, statuses, '전체 상태', curStat);
    }

    function filterData() {
        if (globalData.length === 0) return;

        const sDate = document.getElementById('searchDate').value;
        const sProduct = document.getElementById('searchProduct').value;
        const sProcess = document.getElementById('searchProcess').value;
        const sLot = document.getElementById('searchLot').value;
        const sRemark = document.getElementById('searchRemark').value;
        const sStatus = document.getElementById('searchStatus').value;

        const iDate = document.getElementById('inputDate').value.toLowerCase().trim();
        const iProduct = document.getElementById('inputProduct').value.toLowerCase().trim();
        const iProcess = document.getElementById('inputProcess').value.toLowerCase().trim();
        const iLot = document.getElementById('inputLot').value.toLowerCase().trim();
        const iRemark = document.getElementById('inputRemark').value.toLowerCase().trim();
        const iStatus = document.getElementById('inputStatus').value.toLowerCase().trim();

        const filtered = globalData.filter(row => {
            if (sDate && row['생산일자'] !== sDate) return false;
            if (sProduct && row['제품명'] !== sProduct) return false;
            if (sProcess && row['공정'] !== sProcess) return false;
            if (sLot && row['로트'] !== sLot) return false;
            if (sRemark && row['비고'] !== sRemark) return false;
            if (sStatus && row['상태'] !== sStatus) return false;

            if (iDate) {
                let dateInfo = formatDateWithDayAndColor(row['생산일자']);
                let targetString = (row['생산일자'] + " " + dateInfo.dayStr).toLowerCase();
                if (!targetString.includes(iDate)) return false;
            }

            if (iProduct && !row['제품명'].toLowerCase().includes(iProduct)) return false;
            if (iProcess && !row['공정'].toLowerCase().includes(iProcess)) return false;
            if (iLot && !row['로트'].toLowerCase().includes(iLot)) return false;
            if (iRemark && !row['비고'].toLowerCase().includes(iRemark)) return false;
            if (iStatus && !row['상태'].toLowerCase().includes(iStatus)) return false;

            return true;
        });

        renderTable(filtered);
    }

    function resetSearch() {
        document.getElementById('searchDate').value = "";
        document.getElementById('searchProduct').value = "";
        document.getElementById('searchProcess').value = "";
        document.getElementById('searchLot').value = "";
        document.getElementById('searchRemark').value = "";
        document.getElementById('searchStatus').value = "";

        document.getElementById('inputDate').value = "";
        document.getElementById('inputProduct').value = "";
        document.getElementById('inputProcess').value = "";
        document.getElementById('inputLot').value = "";
        document.getElementById('inputRemark').value = "";
        document.getElementById('inputStatus').value = "";

        updateDropdownOptions();
        renderTable(globalData);
    }

    function renderTable(data) {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        let sumQty = 0;
        let totalCount = data.length;

        if (totalCount === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-message">조건에 맞는 데이터가 없습니다.</td></tr>';
            document.getElementById('totalQtySum').textContent = '0건 / 0 EA';
            return;
        }

        let sortedData = [...data].sort((a, b) => b['생산일자'].localeCompare(a['생산일자']));

        sortedData.forEach(row => {
            sumQty += row['생산수량'];
            let formattedQty = row['생산수량'].toLocaleString();
            let dateInfo = formatDateWithDayAndColor(row['생산일자']);

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center" style="color: ${dateInfo.color}; font-weight: bold;">${dateInfo.text}</td>
                <td><strong>${row['제품명']}</strong></td>
                <td>${row['공정']}</td>
                <td><span style="background:#eef2f5; padding:3px 8px; border-radius:4px; font-family:monospace;">${row['로트']}</span></td>
                <td class="text-right"><strong>${formattedQty}</strong></td>
                <td>${row['비고']}</td>
                <td>${row['상태']}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('totalQtySum').textContent = `${totalCount.toLocaleString()}건 / ${sumQty.toLocaleString()} EA`;
    }
