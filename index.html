<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사침 생산현황 통합 검색 대시보드</title>
    <!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        
        /* 상단 파일 관리 버튼 영역 */
        .top-file-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #eef2f5;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
        }
        .btn-open-modal {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-open-modal:hover {
            background-color: #1a252f;
        }

        /* 모달 팝업 창 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-close-modal {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #7f8c8d;
        }
        .file-list-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .file-item:last-child { border-bottom: none; }
        .btn-file-del {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-file-del:hover { background-color: #c0392b; }

        /* 검색 영역 스타일 (가로 한 줄 배치) */
        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: flex-end;
            background-color: #fcfcfc;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 150px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        .search-section select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }
        .btn-search {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
        }
        .btn-search:hover { background-color: #2980b9; }
        .btn-reset {
            padding: 10px 18px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
        }
        .btn-reset:hover { background-color: #7f8c8d; }

        /* 테이블 및 합계 스타일 */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            max-height: 550px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover { background-color: #f1f6f9; }
        .empty-message {
            text-align: center;
            padding: 25px;
            color: #7f8c8d;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }

        /* 합계 강조 바 스타일 */
        .summary-bar {
            margin-top: 15px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #117a65;
        }
        .summary-value {
            font-size: 20px;
            color: #0e6251;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>주사침 생산현황 통합 검색</h1>
    
    <!-- 상단 파일 관리 바 (메인 화면 지저분함 방지) -->
    <div class="top-file-bar">
        <div>
            <strong>📁 생산현황 파일 관리</strong>
            <span id="fileCountBadge" style="margin-left: 10px; font-size: 14px; color: #555;">저장된 파일: 0개</span>
        </div>
        <button class="btn-open-modal" onclick="openFileManager()">파일 관리 및 추가 창 열기</button>
    </div>

    <!-- 파일 관리 모달 팝업 창 -->
    <div class="modal-overlay" id="fileModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>파일 업로드 및 삭제 관리</span>
                <button class="btn-close-modal" onclick="closeFileManager()">&times;</button>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="excelFile" style="display:block; margin-bottom:8px; font-weight:bold; font-size:14px;">엑셀 파일 추가 (.xlsx, .xls)</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" style="font-size: 14px; width: 100%;">
            </div>
            <div style="font-size: 13px; color: #e67e22; margin-bottom: 10px;">* 파일을 선택하면 자동 저장되어 전체 데이터에 합산됩니다.</div>
            <div style="font-weight: bold; font-size: 14px; margin-top: 15px;">저장된 파일 목록:</div>
            <div class="file-list-box" id="fileListBox">
                <div style="color: #888; font-size: 13px; text-align: center; padding: 10px;">저장된 파일이 없습니다.</div>
            </div>
        </div>
    </div>

    <!-- 검색 영역 (가로 한 줄 배치) -->
    <div class="search-section">
        <div class="filter-group">
            <label>생산일자</label>
            <select id="searchDate" onchange="updateDropdownOptions()">
                <option value="">전체 일자</option>
            </select>
        </div>

        <div class="filter-group">
            <label>제품명</label>
            <select id="searchProduct" onchange="updateDropdownOptions()">
                <option value="">전체 제품명</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>공정명</label>
            <select id="searchProcess" onchange="updateDropdownOptions()">
                <option value="">전체 공정</option>
            </select>
        </div>

        <div class="filter-group">
            <label>로트 번호</label>
            <select id="searchLot" onchange="updateDropdownOptions()">
                <option value="">전체 로트</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>비고/상태</label>
            <select id="searchRemark">
                <option value="">전체 상태</option>
            </select>
        </div>

        <div class="button-group">
            <button class="btn-search" onclick="filterData()">검색</button>
            <button class="btn-reset" onclick="resetSearch()">초기화</button>
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>생산일자</th>
                    <th>제품명</th>
                    <th>공정</th>
                    <th>로트</th>
                    <th class="text-right">생산수량</th>
                    <th>비고</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="empty-message">상단에서 파일 관리 창을 열어 엑셀 파일을 업로드해 주세요.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 생산수량 합계 표시 바 -->
    <div class="summary-bar">
        <span>🔍 검색된 조건의 생산수량 총합</span>
        <span class="summary-value" id="totalQtySum">0 EA</span>
    </div>
</div>

<script>
    let globalData = [];     
    let savedFiles = [];     

    window.onload = function() {
        const stored = localStorage.getItem('savedExcelFiles');
        if (stored) {
            try {
                savedFiles = JSON.parse(stored);
                processAllSavedFiles();
            } catch(e) {
                savedFiles = [];
            }
        }
    };

    function openFileManager() {
        document.getElementById('fileModal').style.display = 'flex';
    }

    function closeFileManager() {
        document.getElementById('fileModal').style.display = 'none';
    }

    function excelDateToJSDate(serial) {
        if (!isNaN(serial) && serial > 30000) {
            let utc_days = Math.floor(serial - 25569);
            let utc_value = utc_days * 86400;
            let date_info = new Date(utc_value * 1000);
            let year = date_info.getUTCFullYear();
            let month = String(date_info.getUTCMonth() + 1).padStart(2, '0');
            let day = String(date_info.getUTCDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        let str = String(serial).trim();
        if (str.includes('T')) str = str.split('T')[0];
        if (str.includes(' ')) str = str.split(' ')[0];
        return str;
    }

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
            const buffer = uploadEvent.target.result;
            
            savedFiles = savedFiles.filter(f => f.name !== file.name);
            savedFiles.push({
                name: file.name,
                data: Array.from(new Uint8Array(buffer))
            });

            localStorage.setItem('savedExcelFiles', JSON.stringify(savedFiles));
            processAllSavedFiles();
            e.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    });

    function removeFile(fileName) {
        savedFiles = savedFiles.filter(f => f.name !== fileName);
        localStorage.setItem('savedExcelFiles', JSON.stringify(savedFiles));
        processAllSavedFiles();
    }

    function processAllSavedFiles() {
        globalData = [];
        let rawCombined = [];

        savedFiles.forEach(fileObj => {
            try {
                const uint8Arr = new Uint8Array(fileObj.data);
                const workbook = XLSX.read(uint8Arr, {type: 'array', cellDates: true});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                
                let currentProdDate = ""; 
                let colIdx = { product: -1, process: -1, qty: -1, remark: -1 };

                for (let i = 0; i < rawData.length; i++) {
                    let row = rawData[i].map(cell => String(cell).trim());

                    if (row.includes("생산일자")) {
                        let dIdx = row.indexOf("생산일자");
                        if (i + 1 < rawData.length) {
                            let rawDateVal = rawData[i+1][dIdx];
                            if (rawDateVal !== undefined && rawDateVal !== "") {
                                if (rawDateVal instanceof Date) {
                                    currentProdDate = `${rawDateVal.getFullYear()}-${String(rawDateVal.getMonth() + 1).padStart(2, '0')}-${String(rawDateVal.getDate()).padStart(2, '0')}`;
                                } else {
                                    currentProdDate = excelDateToJSDate(rawDateVal);
                                }
                            }
                        }
                    }

                    if (row.includes("제품명") && row.includes("공정")) {
                        colIdx.product = row.indexOf("제품명");
                        colIdx.process = row.indexOf("공정");
                        colIdx.qty = row.indexOf("생산수량");
                        colIdx.remark = row.indexOf("비고");
                        
                        for (let j = i + 1; j < rawData.length; j++) {
                            let dataRow = rawData[j];
                            let pName = String(dataRow[colIdx.product] || "").trim();
                            
                            if (!pName || pName === "제품명" || pName.includes("업무보고")) {
                                if (pName.includes("생산 일일 업무보고")) {
                                    for (let d = j; d < Math.min(j + 3, rawData.length); d++) {
                                        for (let c = 0; c < rawData[d].length; c++) {
                                            let val = rawData[d][c];
                                            if (val !== undefined && val !== "") {
                                                let sVal = String(val);
                                                if (sVal.includes("2026-") || sVal.includes("2025-") || !isNaN(val) && Number(val) > 40000) {
                                                    if (val instanceof Date) {
                                                        currentProdDate = `${val.getFullYear()}-${String(val.getMonth()+1).padStart(2,'0')}-${String(val.getDate()).padStart(2,'0')}`;
                                                    } else {
                                                        currentProdDate = excelDateToJSDate(val);
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                                continue;
                            }

                            if (pName === "특이사항") continue;

                            let rawProcessStr = String(dataRow[colIdx.process] || "").trim();
                            let qty = String(dataRow[colIdx.qty] || "").trim();
                            let remark = String(dataRow[colIdx.remark] || "").trim();

                            let cleanProcess = rawProcessStr;
                            let extractedLot = "";

                            let lotMatch = rawProcessStr.match(/\((?:로트\s*[:]?)\s*([^)]+)\)/i);
                            if (lotMatch) {
                                extractedLot = lotMatch[1].trim();
                                cleanProcess = rawProcessStr.replace(lotMatch[0], "").trim();
                            } else {
                                let parts = rawProcessStr.split(/로트[:\s]*/);
                                if (parts.length > 1) {
                                    cleanProcess = parts[0].trim();
                                    extractedLot = parts[1].replace(/[()]/g, "").trim();
                                }
                            }

                            let cleanNum = Number(String(qty).replace(/[^0-9.-]+/g,""));
                            let numericQty = !isNaN(cleanNum) ? cleanNum : 0;

                            rawCombined.push({
                                "생산일자": currentProdDate || "-",
                                "제품명": pName,
                                "공정": cleanProcess || rawProcessStr,
                                "로트": extractedLot || "-",
                                "생산수량": numericQty,
                                "비고": remark
                            });
                        }
                    }
                }
            } catch(err) {
                console.error("파일 읽기 오류:", fileObj.name);
            }
        });

        // 중복 데이터 제거
        let uniqueMap = new Map();
        rawCombined.forEach(item => {
            let key = `${item['생산일자']}_${item['제품명']}_${item['공정']}_${item['로트']}_${item['생산수량']}_${item['비고']}`;
            uniqueMap.set(key, item);
        });
        globalData = Array.from(uniqueMap.values());

        updateFileListUI();
        updateDropdownOptions();
        renderTable(globalData);
    }

    function updateFileListUI() {
        const listBox = document.getElementById('fileListBox');
        const badge = document.getElementById('fileCountBadge');
        badge.textContent = `저장된 파일: ${savedFiles.length}개`;

        if (savedFiles.length === 0) {
            listBox.innerHTML = '<div style="color: #888; font-size: 13px; text-align: center; padding: 10px;">저장된 파일이 없습니다.</div>';
            return;
        }

        listBox.innerHTML = '';
        savedFiles.forEach(f => {
            let item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
                <span>📄 <strong>${f.name}</strong></span>
                <button class="btn-file-del" onclick="removeFile('${f.name}')">삭제</button>
            `;
            listBox.appendChild(item);
        });
    }

    function updateDropdownOptions() {
        if (globalData.length === 0) return;

        const selDate = document.getElementById('searchDate');
        const selProduct = document.getElementById('searchProduct');
        const selProcess = document.getElementById('searchProcess');
        const selLot = document.getElementById('searchLot');
        const selRemark = document.getElementById('searchRemark');

        const curDate = selDate.value;
        const curProd = selProduct.value;
        const curProc = selProcess.value;
        const curLot = selLot.value;
        const curRem = selRemark.value;

        let filterForDropdown = (targetField) => {
            return globalData.filter(row => {
                if (targetField !== '생산일자' && curDate && row['생산일자'] !== curDate) return false;
                if (targetField !== '제품명' && curProd && row['제품명'] !== curProd) return false;
                if (targetField !== '공정' && curProc && row['공정'] !== curProc) return false;
                if (targetField !== '로트' && curLot && row['로트'] !== curLot) return false;
                if (targetField !== '비고' && curRem && row['비고'] !== curRem) return false;
                return true;
            });
        };

        let dates = [...new Set(filterForDropdown('생산일자').map(r => r['생산일자']))].filter(v => v && v !== '-');
        let products = [...new Set(filterForDropdown('제품명').map(r => r['제품명']))].filter(v => v);
        let processes = [...new Set(filterForDropdown('공정').map(r => r['공정']))].filter(v => v);
        let lots = [...new Set(filterForDropdown('로트').map(r => r['로트']))].filter(v => v && v !== '-');
        let remarks = [...new Set(filterForDropdown('비고').map(r => r['비고']))].filter(v => v);

        let updateSelectHtml = (element, list, defaultText, currentValue) => {
            element.innerHTML = `<option value="">${defaultText}</option>`;
            list.sort().forEach(item => {
                let selected = (item === currentValue) ? 'selected' : '';
                element.innerHTML += `<option value="${item}" ${selected}>${item}</option>`;
            });
        };

        updateSelectHtml(selDate, dates, '전체 일자', curDate);
        updateSelectHtml(selProduct, products, '전체 제품명', curProd);
        updateSelectHtml(selProcess, processes, '전체 공정', curProc);
        updateSelectHtml(selLot, lots, '전체 로트', curLot);
        updateSelectHtml(selRemark, remarks, '전체 상태', curRem);
    }

    function filterData() {
        if (globalData.length === 0) return;

        const sDate = document.getElementById('searchDate').value;
        const sProduct = document.getElementById('searchProduct').value;
        const sProcess = document.getElementById('searchProcess').value;
        const sLot = document.getElementById('searchLot').value;
        const sRemark = document.getElementById('searchRemark').value;

        const filtered = globalData.filter(row => {
            return (sDate === "" || row['생산일자'] === sDate) &&
                   (sProduct === "" || row['제품명'] === sProduct) &&
                   (sProcess === "" || row['공정'] === sProcess) &&
                   (sLot === "" || row['로트'] === sLot) &&
                   (sRemark === "" || row['비고'] === sRemark);
        });

        renderTable(filtered);
    }

    function resetSearch() {
        document.getElementById('searchDate').value = "";
        document.getElementById('searchProduct').value = "";
        document.getElementById('searchProcess').value = "";
        document.getElementById('searchLot').value = "";
        document.getElementById('searchRemark').value = "";
        updateDropdownOptions();
        renderTable(globalData);
    }

    function renderTable(data) {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        let sumQty = 0;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-message">조건에 맞는 데이터가 없습니다.</td></tr>';
            document.getElementById('totalQtySum').textContent = '0 EA';
            return;
        }

        data.forEach(row => {
            sumQty += row['생산수량'];
            let formattedQty = row['생산수량'].toLocaleString();

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center">${row['생산일자']}</td>
                <td><strong>${row['제품명']}</strong></td>
                <td>${row['공정']}</td>
                <td><span style="background:#eef2f5; padding:3px 8px; border-radius:4px; font-family:monospace;">${row['로트']}</span></td>
                <td class="text-right"><strong>${formattedQty}</strong></td>
                <td>${row['비고']}</td>
            `;
            tbody.appendChild(tr);
        });

        // 합계 표시 업데이트
        document.getElementById('totalQtySum').textContent = sumQty.toLocaleString() + ' EA';
    }
</script>
</body>
</html>
