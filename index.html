<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사침 생산현황 통합 검색 대시보드</title>
    <!-- 엑셀 파일을 읽기 위한 라이브러리 (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        
        /* 상단 안내 바 영역 */
        .top-info-bar {
            margin-bottom: 20px;
            background-color: #eef2f5;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            font-size: 14px;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 검색 영역 스타일 (가로 한 줄 배치) */
        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: flex-end;
            background-color: #fcfcfc;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-radius: 8px 8px 0 0;
            flex-wrap: wrap;
        }
        /* 직접 입력 검색 영역 스타일 */
        .input-search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: flex-end;
            background-color: #f8f9fa;
            padding: 15px 20px;
            border: 1px solid #eee;
            border-top: none;
            border-radius: 0 0 8px 8px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 150px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        .search-section select, .input-search-section input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }
        .btn-search {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
        }
        .btn-search:hover { background-color: #2980b9; }
        .btn-reset {
            padding: 10px 18px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
            height: 41px;
        }
        .btn-reset:hover { background-color: #7f8c8d; }

        /* 테이블 및 합계 스타일 */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            max-height: 550px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover { background-color: #f1f6f9; }
        .empty-message {
            text-align: center;
            padding: 25px;
            color: #7f8c8d;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }

        /* 합계 강조 바 스타일 */
        .summary-bar {
            margin-top: 15px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #117a65;
        }
        .summary-value {
            font-size: 20px;
            color: #0e6251;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>주사침 생산현황 통합 검색</h1>
    
    <!-- 상단 안내 바 -->
    <div class="top-info-bar">
        <span>📁 <strong>GitHub 저장소 자동 연동 모드:</strong> 저장소에 업로드된 모든 엑셀 파일(.xlsx)을 자동으로 감지하여 통합 조회합니다.</span>
        <span id="fileCountBadge" style="font-weight: bold; color: #2980b9;">엑셀 파일 스캔 중...</span>
    </div>

    <!-- 1단: 드롭다운 선택 검색 영역 -->
    <div class="search-section">
        <div class="filter-group">
            <label>생산일자 (선택)</label>
            <select id="searchDate" onchange="updateDropdownOptions()">
                <option value="">전체 일자</option>
            </select>
        </div>

        <div class="filter-group">
            <label>제품명 (선택)</label>
            <select id="searchProduct" onchange="updateDropdownOptions()">
                <option value="">전체 제품명</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>공정명 (선택)</label>
            <select id="searchProcess" onchange="updateDropdownOptions()">
                <option value="">전체 공정</option>
            </select>
        </div>

        <div class="filter-group">
            <label>로트 번호 (선택)</label>
            <select id="searchLot" onchange="updateDropdownOptions()">
                <option value="">전체 로트</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>비고/상태 (선택)</label>
            <select id="searchRemark">
                <option value="">전체 상태</option>
            </select>
        </div>
    </div>

    <!-- 2단: 직접 입력 검색 영역 -->
    <div class="input-search-section">
        <div class="filter-group">
            <label>생산일자 (직접 입력)</label>
            <input type="text" id="inputDate" placeholder="일자 입력 (예: 2026-11)">
        </div>

        <div class="filter-group">
            <label>제품명 (직접 입력)</label>
            <input type="text" id="inputProduct" placeholder="제품명 입력">
        </div>
        
        <div class="filter-group">
            <label>공정명 (직접 입력)</label>
            <input type="text" id="inputProcess" placeholder="공정명 입력">
        </div>

        <div class="filter-group">
            <label>로트 번호 (직접 입력)</label>
            <input type="text" id="inputLot" placeholder="로트 입력">
        </div>
        
        <div class="filter-group">
            <label>비고/상태 (직접 입력)</label>
            <input type="text" id="inputRemark" placeholder="상태 입력">
        </div>

        <div class="button-group">
            <button class="btn-search" onclick="filterData()">검색</button>
            <button class="btn-reset" onclick="resetSearch()">초기화</button>
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>생산일자</th>
                    <th>제품명</th>
                    <th>공정</th>
                    <th>로트</th>
                    <th class="text-right">생산수량</th>
                    <th>비고</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="empty-message">데이터를 불러오는 중입니다...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 생산수량 합계 표시 바 -->
    <div class="summary-bar">
        <span>🔍 검색된 조건의 생산수량 총합</span>
        <span class="summary-value" id="totalQtySum">0 EA</span>
    </div>
</div>

<script>
    let globalData = [];     

    window.onload = function() {
        loadAllGithubExcelFiles();
    };

    async function loadAllGithubExcelFiles() {
        try {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            let owner = "";
            let repo = "";

            if (window.location.hostname.includes("github.io")) {
                owner = window.location.hostname.split('.')[0];
                repo = pathSegments.length > 0 ? pathSegments[0] : "";
            }

            let filesToProcess = [];

            if (owner && repo) {
                let apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents`;
                let response = await fetch(apiUrl);
                if (response.ok) {
                    let repoContents = await response.json();
                    filesToProcess = repoContents
                        .filter(item => item.type === 'file' && item.name.endsWith('.xlsx') && item.name.includes('생산일일보고'))
                        .map(item => item.name);
                }
            }

            if (filesToProcess.length === 0) {
                filesToProcess = [
                    "생산일일보고_주사침팀 260605.xlsx", "생산일일보고_주사침팀 260612.xlsx",
                    "생산일일보고_주사침팀 260619, 20.xlsx", "생산일일보고_주사침팀 260626, 27.xlsx",
                    "생산일일보고_주사침팀 260703.xlsx", "생산일일보고_주사침팀 260710.xlsx",
                    "생산일일보고_주사침팀 260716.xlsx", "생산일일보고_주사침팀 260724.xlsx",
                    "생산일일보고_주사침팀 260731.xlsx", "생산일일보고_주사침팀 260807.xlsx",
                    "생산일일보고_주사침팀 260814.xlsx", "생산일일보고_주사침팀 260821.xlsx",
                    "생산일일보고_주사침팀 260828.xlsx", "생산일일보고_주사침팀 260901.xlsx",
                    "생산일일보고_주사침팀 261002.xlsx", "생산일일보고_주사침팀 261008.xlsx",
                    "생산일일보고_주사침팀 261016.xlsx", "생산일일보고_주사침팀 261023.xlsx",
                    "생산일일보고_주사침팀 261030.xlsx", "생산일일보고_주사침팀 261106.xlsx",
                    "생산일일보고_주사침팀 261110.xlsx"
                ];
            }

            let rawCombined = [];
            let loadedCount = 0;

            for (let fileName of filesToProcess) {
                try {
                    let res = await fetch(fileName);
                    if (!res.ok) continue;
                    let buffer = await res.arrayBuffer();
                    
                    const workbook = XLSX.read(new Uint8Array(buffer), {type: 'array', cellDates: true});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                    
                    let currentProdDate = ""; 
                    let colIdx = { product: -1, process: -1, qty: -1, remark: -1 };

                    for (let i = 0; i < rawData.length; i++) {
                        let row = rawData[i].map(cell => String(cell).trim());

                        if (row.includes("생산일자")) {
                            let dIdx = row.indexOf("생산일자");
                            if (i + 1 < rawData.length) {
                                let rawDateVal = rawData[i+1][dIdx];
                                if (rawDateVal !== undefined && rawDateVal !== "") {
                                    if (rawDateVal instanceof Date) {
                                        currentProdDate = `${rawDateVal.getFullYear()}-${String(rawDateVal.getMonth() + 1).padStart(2, '0')}-${String(rawDateVal.getDate()).padStart(2, '0')}`;
                                    } else {
                                        currentProdDate = excelDateToJSDate(rawDateVal);
                                    }
                                }
                            }
                        }

                        if (row.includes("제품명") && row.includes("공정")) {
                            colIdx.product = row.indexOf("제품명");
                            colIdx.process = row.indexOf("공정");
                            colIdx.qty = row.indexOf("생산수량");
                            colIdx.remark = row.indexOf("비고");
                            
                            for (let j = i + 1; j < rawData.length; j++) {
                                let dataRow = rawData[j];
                                let pName = String(dataRow[colIdx.product] || "").trim();
                                
                                if (!pName || pName === "제품명" || pName.includes("업무보고")) {
                                    if (pName.includes("생산 일일 업무보고")) {
                                        for (let d = j; d < Math.min(j + 3, rawData.length); d++) {
                                            for (let c = 0; c < rawData[d].length; c++) {
                                                let val = rawData[d][c];
                                                if (val !== undefined && val !== "") {
                                                    let sVal = String(val);
                                                    if (sVal.includes("2026-") || sVal.includes("2025-") || !isNaN(val) && Number(val) > 40000) {
                                                        if (val instanceof Date) {
                                                            currentProdDate = `${val.getFullYear()}-${String(val.getMonth()+1).padStart(2,'0')}-${String(val.getDate()).padStart(2,'0')}`;
                                                        } else {
                                                            currentProdDate = excelDateToJSDate(val);
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                    continue;
                                }

                                if (pName === "특이사항") continue;

                                let rawProcessStr = String(dataRow[colIdx.process] || "").trim();
                                let qty = String(dataRow[colIdx.qty] || "").trim();
                                let remark = String(dataRow[colIdx.remark] || "").trim();

                                let cleanProcess = rawProcessStr;
                                let extractedLot = "";

                                let lotMatch = rawProcessStr.match(/\((?:로트\s*[:]?)\s
